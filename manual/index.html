<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>客服手册</title>
<meta name="robots" content="noindex, nofollow">
<script src="../hq/auth.js?v=20261127b" data-nobadge></script>
<script>document.documentElement.setAttribute('data-theme', HQAuth.theme())</script>
<script src="../hq/bus.js?v=20261127a"></script>
<style>
/* 客服手册：跟名字审核、技术单审核、保健品分督导同一套（米色底、金色重点、水墨左栏）。内容只在登入后从云端载入 */
:root{--bg:#F6F1E7;--surface:#FFFDF8;--sunk:#F3ECDF;--ink:#2B2620;--muted:#6F6553;--faint:#7A6F5C;--line:#E8DFCC;--line-soft:#F0E9DB;--field:#DCCFB4;
  --accent:#9A6B22;--accent-hover:#7E5718;--accent-soft:#F6ECD9;--accent-ink:#6E4B12;--on-accent:#FFFFFF;--crit:#B3261E;--crit-bg:#FBE9E7;--ok:#137333;--ok-bg:#E6F4EA;--warn:#7A4300;--warn-bg:#FFF1DC;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif}
:root[data-theme="dark"]{--bg:#0F1217;--surface:#161A21;--sunk:#12151B;--ink:#E8EAED;--muted:#9AA7BD;--faint:#6B7385;--line:#2A303C;--line-soft:#1E232C;--field:#343B49;
  --accent:#D4AA5E;--accent-hover:#E2BE7A;--accent-soft:#3A2F1C;--accent-ink:#E9C98A;--on-accent:#1A1916;--crit:#FF8A80;--crit-bg:#3A1C1A;--ok:#7FCC8C;--ok-bg:#183020;--warn:#F2B866;--warn-bg:#33270F;color-scheme:dark}
.theme svg{flex:none}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background-color:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{margin:0;line-height:1.3}
p{margin:0}
.shell{min-height:100vh}
.side{display:none}
@media (min-width:1000px){
  .shell{display:grid;grid-template-columns:240px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 12px}
}
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px}
@media (min-width:720px){.top-in{padding:14px 28px}}
.top .sub{font-size:13px;color:var(--muted)}
.top-r{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.home{font-size:13px;color:var(--muted);text-decoration:none}
@media (min-width:1000px){.ph-only{display:none!important}}
@media (max-width:999px){.desk-only{display:none!important}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid var(--field);border-radius:10px;background:var(--surface);color:var(--ink);font-weight:500;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:default}
.page{max-width:1120px;margin:0 auto;padding:24px 16px 80px;display:flex;flex-direction:column;gap:20px}
@media (min-width:720px){.page{padding:28px 28px 60px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 24px -18px rgba(110,75,18,.4)}
.pad{padding:18px 22px}
.small{font-size:13px;color:var(--muted)}
.status{display:flex;align-items:center;gap:10px;color:var(--accent-ink)}
.error{background:var(--crit-bg);color:var(--crit)}
.lock{display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.lock h2{font-size:17px}
.ic{width:22px;height:22px;flex:none}
/* ---------- 首页 ---------- */
.home-hero{padding-bottom:26px}
.home-hero h2{display:flex;align-items:center;gap:14px}
.home-hero h2 .ic{width:46px;height:46px;color:var(--accent)}
.bigsearch{position:relative;max-width:640px;margin-top:18px}
.bigsearch input{width:100%;min-height:52px;padding:0 128px 0 46px;border:1px solid var(--field);border-radius:999px;background:var(--surface);font:inherit;font-size:16px;box-shadow:0 8px 22px -16px rgba(110,75,18,.45)}
.bigsearch .ic{position:absolute;left:16px;top:15px;color:var(--faint)}
.bigsearch button{position:absolute;right:5px;top:5px;min-height:42px;border-radius:999px;padding:0 22px}
.hot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:12px;font-size:13px;color:var(--muted)}
.hot a{color:var(--accent-ink);text-decoration:none;padding:2px 10px;border-radius:999px;background:rgba(255,253,248,.7);border:1px solid var(--line)}
.hot a:hover{border-color:var(--accent)}
.sec-h{display:flex;align-items:center;gap:10px;font-family:var(--g-brush);font-weight:700;font-size:19px;color:var(--ink)}
.sec-h .ic{color:var(--accent)}
.sec-h .count{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:2px 10px}
.cats{display:grid;gap:20px}
@media (min-width:720px){.cats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1200px){.cats{grid-template-columns:repeat(6,minmax(0,1fr))}.cat{grid-column:span 2}}
.cat::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--accent),transparent 70%)}
.cat{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px;padding:18px 22px;text-decoration:none;color:inherit;background:linear-gradient(135deg,var(--surface) 55%,var(--accent-soft));transition:transform .15s,box-shadow .15s}
.cat:hover{transform:translateY(-2px);box-shadow:0 16px 30px -18px rgba(110,75,18,.55)}
.cat .t{display:flex;align-items:center;gap:12px;font-family:var(--g-brush);font-weight:700;font-size:18px}
.cat .t .ic{width:30px;height:30px;color:var(--accent)}
.cat .d{font-size:13px;color:var(--muted);line-height:1.6;min-height:42px}
.cat .n{align-self:flex-start;font-size:13px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);border:1px solid var(--line);border-radius:999px;padding:3px 12px}
.cat .wm{position:absolute;right:-10px;bottom:-16px;color:var(--accent);opacity:.1;pointer-events:none}
.cat .wm .ic{width:104px;height:104px}
.trio{display:grid;gap:20px}
@media (min-width:1000px){.trio{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mini{display:flex;flex-direction:column;gap:10px}
.mini h3{display:flex;align-items:center;gap:8px;font-family:var(--g-brush);font-weight:700;font-size:16px}
.mini h3 .ic{width:20px;height:20px;color:var(--accent)}
.mini ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.mini li a{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line-soft);color:var(--ink);text-decoration:none;font-size:14px}
.mini li:first-child a{border-top:0}
.mini li a:hover{color:var(--accent-ink)}
.mini .when{font-size:12px;color:var(--faint);white-space:nowrap}
.mini .empty{font-size:13px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.quick a{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none;font-size:14px;background:var(--surface)}
.quick a:hover{border-color:var(--accent)}
.quick a .ic{width:18px;height:18px;color:var(--accent)}
.results{display:flex;flex-direction:column}
.results a{display:flex;flex-direction:column;gap:4px;padding:14px 22px;border-top:1px solid var(--line-soft);text-decoration:none;color:inherit}
.results a:first-child{border-top:0}
.results a:hover{background:var(--sunk)}
.results .rt{font-weight:600}
.results .rt span{color:var(--faint);font-weight:400;margin-right:6px}
.results .rs{font-size:13px;color:var(--muted)}
/* ---------- 文章页：照 Mintlify / Stripe / Linear 这类说明文件的排法——一张纸、小标题分段、直排步骤、右边本页目录 ---------- */
.read{--cat:var(--accent);display:grid;gap:28px;align-items:start}
@media (min-width:1000px){.read{grid-template-columns:236px minmax(0,1fr)}.read.wide{grid-template-columns:minmax(0,1fr)}.read.wide .hbnav{display:none}}
@media (min-width:1500px){.read{grid-template-columns:236px minmax(0,1fr) 190px}.read.wide{grid-template-columns:minmax(0,1fr) 190px}}
.hbnav{display:flex;flex-direction:column;gap:2px;padding:14px 10px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
@media (min-width:1000px){.hbnav{position:sticky;top:96px;max-height:calc(100vh - 116px);overflow-y:auto}}
.hbnav .homelink{display:flex;align-items:center;gap:8px;padding:6px 8px;color:var(--accent-ink);text-decoration:none;font-size:14px;font-weight:600}
.hbnav .homelink .ic{width:18px;height:18px}
.hbnav .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 8px 6px;font-size:13px;color:var(--muted)}
.hbnav .hd b{font-family:var(--g-brush);font-size:15px;color:var(--ink)}
.hbnav .hd .count{font-size:12px;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:1px 8px}
.hbnav details{margin-top:8px}
.hbnav summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:32px;padding:0 8px;cursor:pointer;font-size:13px;font-weight:700;color:var(--ink)}
.hbnav summary::-webkit-details-marker{display:none}
.hbnav summary .ic{width:16px;height:16px;color:var(--cat)}
.hbnav summary .k{margin-left:auto;font-weight:400;font-size:12px;color:var(--faint)}
.hbnav summary::after{content:"";width:6px;height:6px;border-right:1.5px solid var(--faint);border-bottom:1.5px solid var(--faint);transform:rotate(45deg);margin:0 4px 3px}
.hbnav details[open] summary::after{transform:rotate(-135deg);margin-bottom:-3px}
.hbnav details a{display:block;margin-left:16px;padding:6px 10px;border-left:1px solid var(--line);color:var(--muted);text-decoration:none;font-size:14px;line-height:1.45}
.hbnav details a:hover{color:var(--ink);border-left-color:var(--faint)}
.hbnav details a[aria-current]{border-left:2px solid var(--cat);padding-left:9px;color:var(--cat);font-weight:600}
.art{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 40px -32px rgba(110,75,18,.5);padding:26px 44px 36px}
@media (max-width:719px){.art{padding:18px 18px 26px}}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.crumb a{color:var(--muted);text-decoration:none}
.crumb a:hover{color:var(--ink)}
.ahead{display:flex;flex-direction:column;gap:10px;padding:14px 0 22px;border-bottom:1px solid var(--line-soft)}
.ahead .eyebrow{font-size:13px;font-weight:600;color:var(--cat)}
.ahead .row{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px 14px}
.ahead h2{font:700 32px/1.25 var(--sans);color:var(--ink);letter-spacing:.5px}
.ahead h2:focus{outline:none}
.ahead .lead{font-size:15.5px;color:var(--muted)}
.ahead .tools-r{margin-left:auto;display:flex;gap:8px}
.ahead .meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;min-height:24px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--sunk);color:var(--muted)}
.pill.kind{background:var(--accent-soft);color:var(--accent-ink)}
.star[aria-pressed="true"]{color:var(--accent-ink);border-color:var(--accent);background:var(--accent-soft)}
.star svg{width:18px;height:18px}
.star[aria-pressed="true"] svg{fill:currentColor}
.sect-h{display:flex;align-items:center;gap:10px;margin:30px 0 12px;font:700 20px/1.35 var(--sans);color:var(--ink);scroll-margin-top:96px}
.sect-h:first-child{margin-top:22px}
.sect-h .date{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border-radius:8px;background:var(--cat);color:#fff;font-size:13px}
.para{margin:8px 0;line-height:1.75}
.bul{margin:8px 0;padding-left:22px;display:flex;flex-direction:column;gap:6px;line-height:1.7}
.bul li::marker{color:var(--cat)}
/* 步骤：小圆圈编号 + 一条细线连下去 */
.steps{list-style:none;margin:10px 0 6px;padding:0;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:3px 0 20px 46px;line-height:1.7}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 13px/1 var(--sans);color:var(--cat);background:var(--surface);border:1.5px solid var(--cat)}
.steps li::after{content:"";position:absolute;left:15px;top:34px;bottom:4px;width:1.5px;background:var(--line)}
.steps li:last-child{padding-bottom:4px}
.steps li:last-child::after{display:none}
.steps li b{font-weight:700;color:var(--ink)}
.steps li.n{counter-increment:none}
.steps li.n::before{content:"!";color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.steps li.n{color:var(--warn)}
.branch{display:flex;width:fit-content;align-items:center;gap:6px;margin-top:6px;padding:4px 10px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:13px;font-weight:600}
/* 表格、标签 */
.tbl{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:11px 16px;text-align:left;border-top:1px solid var(--line-soft);vertical-align:top}
thead th{background:var(--sunk);font-size:12.5px;color:var(--muted);font-weight:700;border-top:0;white-space:nowrap}
.tbl td:first-child{min-width:7em;font-weight:600}
td.act{width:1%;white-space:nowrap}
.tag{display:inline-flex;align-items:center;min-height:24px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--sunk);color:var(--ink);white-space:nowrap}
.tag.free{background:var(--ok-bg);color:var(--ok)}
.tag.money{background:var(--accent-soft);color:var(--accent-ink)}
.url{overflow-wrap:anywhere;color:var(--muted);font-size:13px}
/* 资料清单（项目 / 说明） */
.props{margin:12px 0;border-top:1px solid var(--line-soft)}
.props>div{display:grid;grid-template-columns:minmax(110px,180px) minmax(0,1fr);gap:8px 20px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.props dt{color:var(--muted);font-size:14px}
.props dd{margin:0;overflow-wrap:anywhere}
@media (max-width:599px){.props>div{grid-template-columns:1fr}}
/* 小标题 + 清单连续三组以上：卡片格 */
.tips{display:grid;gap:14px;margin:12px 0}
@media (min-width:720px){.tips{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1300px){.tips{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tip{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tip h4{margin:0 0 8px;display:flex;align-items:center;gap:8px;font-size:15px}
.tip h4::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cat)}
.tip ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.6}
.tip ul li::marker{color:var(--faint)}
.alias{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.alias em{font-style:normal;padding:0 8px;border-radius:6px;background:var(--sunk)}
.alias i{font-style:normal;color:var(--faint)}
/* 提示框 */
.callout{display:flex;gap:10px;align-items:flex-start;margin:14px 0;padding:12px 16px;border-radius:12px;background:var(--warn-bg);border:1px solid #F2D7A6;color:var(--warn);line-height:1.7}
.callout .ic{color:var(--warn);margin-top:2px}
.callout ul{margin:0;padding-left:18px}
.helper{display:flex;flex-direction:column;gap:12px;margin:14px 0;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--sunk)}
.helper b{display:flex;align-items:center;gap:6px;color:var(--ink)}
.helper b .ic{width:18px;height:18px;color:var(--cat)}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.field input,.field select{width:100%;min-height:40px;padding:0 10px;border:1px solid var(--field);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:15px}
.row3{display:grid;gap:10px}
@media (min-width:600px){.row3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.answer{font-weight:700;color:var(--accent-ink);overflow-wrap:anywhere}
/* 文末：相关章节、上一章 / 下一章 */
.foot{margin-top:34px;padding-top:22px;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:18px}
.foot h3{font-size:13px;color:var(--muted);margin:0}
.rel{display:flex;flex-wrap:wrap;gap:8px}
.rel a{display:inline-flex;align-items:center;min-height:32px;padding:0 12px;border:1px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none;font-size:14px}
.rel a:hover{border-color:var(--cat);color:var(--cat)}
.pn{display:grid;gap:12px}
@media (min-width:720px){.pn{grid-template-columns:1fr 1fr}}
.pn a{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:inherit}
.pn a:hover{border-color:var(--cat)}
.pn a.next{text-align:right}
.pn small{color:var(--muted)}
.pn b{color:var(--ink)}
/* 右：本页目录 */
.otp{display:none}
@media (min-width:1500px){.otp{display:flex;flex-direction:column;position:sticky;top:96px;font-size:13px}}
.otp b{font-size:12px;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:6px}
.otp a{display:block;padding:5px 0 5px 12px;border-left:1px solid var(--line);color:var(--muted);text-decoration:none;line-height:1.45}
.otp a:hover{color:var(--ink)}
.otp a.on{border-left:2px solid var(--cat);padding-left:11px;color:var(--cat);font-weight:600}

/* 旧浏览器（不认得 color-mix）的备用颜色：写在前面，新浏览器会被后面的覆盖 */
.cat .n{color:var(--cat);background:var(--surface);border-color:var(--line)}
.kpi::after{background:var(--sunk)}
/* ---------- 版面：靠近系统左栏、文章区更宽 ---------- */
.page{max-width:1560px;margin:0}
/* ---------- 颜色：每个业务分类一个颜色 ---------- */
.cat,.read,.kpi{--cat:var(--accent)}
.cat{border-top:0}
.cat::before{background:linear-gradient(90deg,var(--cat),transparent 75%)!important;height:4px!important}
.cat .t .ic{color:var(--cat)!important}
.cat .n{color:var(--cat);border-color:color-mix(in srgb,var(--cat) 35%,transparent);background:color-mix(in srgb,var(--cat) 9%,var(--surface))}
.cat{min-height:168px}
.cat .t,.cat .d,.cat .n{position:relative;z-index:1;max-width:64%}
.cat .cimg{position:absolute;right:0;bottom:0;width:58%;height:100%;object-fit:cover;object-position:right bottom;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 45%);mask-image:linear-gradient(90deg,transparent 0,#000 45%);opacity:.95;pointer-events:none}
.cat .wm{display:none}
/* ---------- 首页：数字概览 + 圆环图 ---------- */
.overview{display:grid;gap:20px}

.kpis{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:720px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1100px){.kpis{grid-template-columns:repeat(5,minmax(0,1fr))}}
.cat.donut-card{background:var(--surface)}
@media (max-width:719px){.kpi:last-child:nth-child(odd){grid-column:span 2}}
.cat.donut-card .t,.cat.donut-card .donut{max-width:none}
.kpi{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:2px;padding:16px 18px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:76px;height:76px;border-radius:50%;background:color-mix(in srgb,var(--cat) 14%,transparent)}
.kpi .ic{color:var(--cat);width:22px;height:22px}
.kpi b{font:700 28px/1.2 var(--sans);color:var(--ink);font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.donut{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut svg{width:150px;height:150px;flex:none}
.donut ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.donut li{display:flex;align-items:center;gap:8px}
.donut li i{width:12px;height:12px;border-radius:3px;flex:none}
.donut li b{margin-left:auto;padding-left:12px;font-variant-numeric:tabular-nums}
mark{background:#FBE7B5;color:inherit;border-radius:3px;padding:0 1px}
/* 深色：写死的浅色配色换掉；分类颜色调亮一点才看得清 */
:root[data-theme="dark"] .callout{border-color:#5A4520}
:root[data-theme="dark"] mark{background:#5A4520;color:#FFE9B8}
:root[data-theme="dark"] .hot a{background:var(--surface)}
:root[data-theme="dark"] .cat .cimg{filter:brightness(.5) saturate(.85)}
:root[data-theme="dark"] .ahead .eyebrow,:root[data-theme="dark"] .hbnav details a[aria-current],:root[data-theme="dark"] .rel a:hover,:root[data-theme="dark"] .hbnav summary .ic,:root[data-theme="dark"] .helper b .ic{color:#E9C98A;color:color-mix(in srgb,var(--cat) 45%,#fff)}
.copied{color:var(--ok)}
@media (max-width:999px){.top{position:static}.read .hbnav{order:2}}
.home{white-space:nowrap}
@media (max-width:480px){.bigsearch input{padding-right:16px}.bigsearch button{display:none}.ahead h2{font-size:25px}}

      ov.tiles +
      '<section aria-labelledby="catH" id="catS"><h2 class="sec-h" id="catH">' + ICON.tech + '业务分类<span class="count">共 ' + HB.chapters.length + ' 章</span></h2></section>' +
      '<div class="cats">' + cats + ov.donut + '</div>' +
      '<div class="trio">' +
      '<section class="card pad mini"><h3>' + ICON.clock + '最近看过</h3>' + (chapLinks(recent.slice(0, 5), function (x) { return ago(x.t); }) || '<p class="empty">打开过的章节会出现在这里。</p>') +
      (often.length ? '<h3>' + ICON.bolt + '常看的章节</h3>' + chapLinks(often, function (x) { return x.v + ' 次'; }) : '') + '</section>' +
      '<section class="card pad mini"><h3>' + ICON.link + '常用快捷</h3>' + (links.length ? '<div class="quick">' + links.map(function (l) { return '<a href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer">' + ICON.system + esc(l.name) + '</a>'; }).join('') + '</div><p class="empty">账号密码找组长拿</p>' : '<p class="empty">手册里没有系统链接。</p>') + '</section>' +
      '<section class="card pad mini"><h3>' + ICON.star + '我的收藏</h3>' + (chapLinks(favs().map(function (n) { return { no: n }; })) || '<p class="empty">在章节右上角点 ☆ 收藏，常用的就放这里。</p>') + '</section>' +
      '</div>';
  }
  function overview(gs) {
    var st = MANUAL.stats(HB), tot = gs.reduce(function (a, g) { return a + g.chapters.length; }, 0) || 1, off = 0, C = 2 * Math.PI * 38;
    var tiles = [['book', st.chapters, '章节', '#A87224'], ['tech', st.groups, '业务分类', '#2F7D6D'], ['flow', st.steps, '操作步骤', '#A3492F'], ['table', st.tables, '规则表格', '#2F5E86'], ['list', st.scripts, '常用话术', '#6D4E8C']];
    var arcs = gs.map(function (g) { var len = g.chapters.length / tot * C, a = '<circle cx="50" cy="50" r="38" fill="none" stroke="' + colorOf(g) + '" stroke-width="16" stroke-dasharray="' + len + ' ' + (C - len) + '" stroke-dashoffset="' + (-off) + '" transform="rotate(-90 50 50)"/>'; off += len; return a; }).join('');
    var donut = '<section class="card cat donut-card" aria-labelledby="dnH"><h3 class="t" id="dnH">' + ICON.flow + '章节分布</h3><div class="donut"><svg viewBox="0 0 100 100" role="img" aria-label="各分类章节数">' + arcs +
      '<text x="50" y="48" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">' + tot + '</text><text x="50" y="62" text-anchor="middle" font-size="8" fill="currentColor" opacity=".65">章</text></svg><ul>' +
      gs.map(function (g) { return '<li><i style="background:' + colorOf(g) + '"></i>' + esc(g.name) + '<b>' + g.chapters.length + ' 章</b></li>'; }).join('') + '</ul></div></section>';
    return { tiles: '<section class="kpis overview" aria-label="手册概览">' + tiles.map(function (x) { return '<div class="kpi" style="--cat:' + x[3] + '">' + ICON[x[0]] + '<b>' + x[1] + '</b><span>' + x[2] + '</span></div>'; }).join('') + '</section>', donut: donut };
  }
  function results() {
    var nos = MANUAL.search(HB, Q), box = $('res'); if (!box) return;
    if (!nos) { box.innerHTML = ''; return; }
    box.innerHTML = '<section class="card" aria-label="搜索结果"><h2 class="sec-h pad" style="padding-bottom:0" role="status">' + ICON.search + '找到 ' + nos.length + ' 章</h2>' +
      (nos.length ? '<div class="results">' + nos.map(function (n) { var c = chap(n), g = MANUAL.groupOf(HB, n); return '<a href="#ch' + n + '"><span class="rt"><span>' + esc(g ? g.name : '') + '</span>' + hl(c.title) + '</span><span class="rs">' + hl(MANUAL.snippet(c, Q)) + '</span></a>'; }).join('') + '</div>'
        : '<p class="pad small">找不到「' + esc(Q) + '」。换个字再搜，例如「戒指」「二次命名」「费用」。</p>') + '</section>';
  }

  // ---------- 文章页 ----------
  function nav(no) {
    return '<nav class="card hbnav" aria-label="客服手册目录"><a class="homelink" href="#">' + ICON.book + '客服手册首页</a><div class="hd"><b>业务流程手册</b><span class="count">共 ' + HB.chapters.length + ' 章</span></div>' +
      MANUAL.groups(HB).map(function (g) {
        var on = g.chapters.some(function (c) { return c.no === no; });
        return '<details style="--cat:' + colorOf(g) + '"' + (on ? ' open' : '') + '><summary>' + ICON_OF(g) + esc(g.name) + '<span class="k">' + g.chapters.length + ' 章</span></summary>' +
          g.chapters.map(function (c) { return '<a href="#ch' + c.no + '"' + (c.no === no ? ' aria-current="page"' : '') + '>' + esc(c.title) + '</a>'; }).join('') + '</details>';
      }).join('') + '</nav>';
  }
  // 步骤：直排编号；「……有没有…… → 有的话……」把「有的话」写在那一步下面；「注意：」是提醒
  function stepHtml(x) {
    var f = MANUAL.flow([x])[0], t = f.kind === 'decision' ? f.text : String(x == null ? '' : x), m = t.match(/^([^：:]{2,12})[：:](.+)$/);
    var body = m && f.kind !== 'note' ? '<b>' + hl(m[1]) + '</b>：' + hl(m[2]) : hl(t);
    return '<li' + (f.kind === 'note' ? ' class="n"' : '') + '><span>' + body + '</span>' + (f.kind === 'decision' ? '<span class="branch">有的话 → ' + hl(f.yes) + '</span>' : '') + '</li>';
  }
  function blockHtml(b) {
    if (b.type === 'h') return '<h4>' + hl(b.text) + '</h4>';
    if (b.type === 'p') return '<p class="para">' + hl(b.text) + '</p>';
    if (b.type === 'ul') return '<ul class="bul">' + b.items.map(function (x) { return '<li>' + itemHtml(x) + '</li>'; }).join('') + '</ul>';
    if (b.type === 'ol') return '<ol class="steps">' + b.items.map(stepHtml).join('') + '</ol>';
    if (b.type === 'table') {
      var t = MANUAL.rowsOf(b), si = -1;
      if (t.head.length === 2 && t.head[0] === '项目') return kvHtml(t);
      t.head.forEach(function (h, i) { if (/话术/.test(h)) si = i; });
      var kinds = t.head.map(function (h, i) {
        if (/发送频率/.test(h)) return 'freq';
        if (t.rows.length && t.rows.every(function (r) { return /^\s*\d+\s*天/.test(r[i] || ''); })) return 'days';
        if (t.rows.filter(function (r) { return isRMB(r[i] || ''); }).length >= 2) return 'money';
        return '';
      });
      var links = t.rows.some(function (r) { return r.some(function (c) { return MANUAL.urlOf(c); }); });
      return '<div class="tbl"><table><thead><tr>' + t.head.map(function (h) { return '<th scope="col">' + esc(h) + '</th>'; }).join('') + (si >= 0 || links ? '<th scope="col"><span class="vh">操作</span></th>' : '') + '</tr></thead><tbody>' +
        t.rows.map(function (r) {
          var u = MANUAL.urlOf(r.join(' '));
          var act = si >= 0 ? '<td class="act"><button type="button" class="btn small" data-text="' + esc(r[si]) + '">复制</button></td>'
            : links ? '<td class="act">' + (u ? '<a class="btn small" href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">打开</a>' : '') + '</td>' : '';
          return '<tr>' + r.map(function (c, i) { return '<td>' + tagCell(c, kinds[i]) + '</td>'; }).join('') + act + '</tr>';
        }).join('') + '</tbody></table></div>';
    }
    return '';
  }
  // 小工具放在用得到的章节：回传期限（回传时限表）、技术单命名（命名示例表）、话术填空（话术表）
  function helper(c) {
    var today = MANUAL.iso(new Date()), h = '';
    c.blocks.forEach(function (b) {
      if (b.type !== 'table') return;
      var t = MANUAL.rowsOf(b), head = t.head.join('|');
      if (/回传时限/.test(head) && !/dlP/.test(h)) {
        var pi = t.head.indexOf('产品类型') >= 0 ? t.head.indexOf('产品类型') : 1, di = t.head.length - 1;
        h += '<div class="helper"><b>' + ICON.tool + '回传期限计算</b><div class="row3"><label class="field">产品<select id="dlP">' + t.rows.map(function (r) { return '<option value="' + esc(MANUAL.days(r[di])) + '">' + esc(r[pi]) + '（' + esc(r[di]) + '）</option>'; }).join('') +
          '</select></label><label class="field">从哪天算<input id="dlD" type="date" value="' + today + '"></label><p class="field">结果<span class="answer" id="dlA"></span></p></div></div>';
      }
      if (/命名示例/.test(head) && !/tnT/.test(h)) {
        var ei = t.head.indexOf('命名示例');
        h += '<div class="helper"><b>' + ICON.tool + '技术单命名产生器</b><div class="row3"><label class="field">类型<select id="tnT">' + t.rows.map(function (r) { return '<option value="' + esc(r[ei]) + '">' + esc(r[0]) + '</option>'; }).join('') +
          '</select></label><label class="field">日期（三天一次写成 2026-10-03&amp;05&amp;06）<input id="tnD" value="' + today + '"></label><p class="field">文件名<span class="answer" id="tnA"></span></p></div><button type="button" class="btn small" data-copy="tnA" style="align-self:flex-start">复制文件名</button></div>';
      }
      if (/话术/.test(head) && !/scO/.test(h)) {
        h += '<div class="helper"><b>' + ICON.tool + '话术填空：填好再按表里的「复制」</b><div class="row3"><label class="field">订单号<input id="scO" autocomplete="off"></label><label class="field">姓名<input id="scN" autocomplete="off"></label><label class="field">日期<input id="scD" type="date" value="' + today + '"></label></div></div>';
      }
    });
    return h;
  }
  function updateHelpers() {
    if ($('dlP')) { var n = $('dlP').value === '' ? null : Number($('dlP').value), r = MANUAL.deadline($('dlD').value, n); $('dlA').textContent = r ? '最晚 ' + r.date + '（星期' + r.week + '）回传' : n == null ? '这项没有固定的回传天数' : '先选日期'; }
    if ($('tnT')) $('tnA').textContent = MANUAL.techName($('tnT').value, $('tnD').value);
  }
  function article(no) {
    var c = chap(no); if (!c) return home();
    var g = MANUAL.groupOf(HB, no), pn = MANUAL.prevNext(HB, no), fav = favs().indexOf(no) >= 0, k = MANUAL.kind(c);
    var notes = [], body = [], toc = [];
    c.blocks.forEach(function (b) { if (b.type === 'p' && /^(注意|特别注意|前提|时间)[：:]/.test(b.text)) notes.push(b.text); else body.push(b); });
    var steps = 0, tables = 0; body.forEach(function (b) { if (b.type === 'ol') steps += b.items.length; if (b.type === 'table') tables++; });
    var lead = [steps ? steps + ' 个步骤' : '', tables ? tables + ' 张表' : '', notes.length ? notes.length + ' 条注意事项' : ''].filter(Boolean).join(' · ');
    // 没有小标题的章：自己加一节，右边目录才有东西
    var first = !body.length || body[0].type === 'h' ? '' : (toc.push({ id: 's0', text: k === '操作指南' ? '操作步骤' : k === '话术' ? '话术' : '规则与资料' }), headHtml(toc[0].text, 's0'));
    var content = first + helper(c) + bodyHtml(body, toc);
    var notice = notes.length ? (toc.push({ id: 'sn', text: '注意事项' }), headHtml('注意事项', 'sn') + '<div class="callout" role="note">' + ICON.warn + '<ul>' + notes.map(function (t) { return '<li>' + hl(t) + '</li>'; }).join('') + '</ul></div>') : '';
    var rel = g ? g.chapters.filter(function (x) { return x.no !== no; }) : [];
    var wide = store.get('man-wide', false);
    return '<div class="read' + (wide ? ' wide' : '') + '" id="read" style="--cat:' + colorOf(g) + '">' + nav(no) +
      '<article class="art" aria-labelledby="artH">' +
      '<nav class="crumb" aria-label="位置"><a href="#">客服手册</a><span aria-hidden="true">›</span>' + (g ? '<a href="#ch' + g.chapters[0].no + '">' + esc(g.name) + '</a><span aria-hidden="true">›</span>' : '') + '<span aria-current="page">' + esc(c.title) + '</span></nav>' +
      '<header class="ahead"><span class="eyebrow">' + esc(g ? g.name : '') + ' · 第 ' + c.no + ' 章</span><div class="row"><h2 id="artH">' + esc(c.title) + '</h2>' +
      '<span class="tools-r"><button type="button" class="btn small desk-only" id="wideBtn" aria-pressed="' + wide + '">' + ICON.side + (wide ? '显示目录' : '收起目录') + '</button>' +
      '<button type="button" class="btn small star" id="favBtn" aria-pressed="' + fav + '">' + ICON.star + (fav ? '已收藏' : '收藏') + '</button></span></div>' +
      (lead ? '<p class="lead">' + esc(lead) + '</p>' : '') +
      '<div class="meta"><span class="pill kind">' + esc(k) + '</span><span>手册整理日期 ' + esc(HB.updated || '') + '</span></div></header>' +
      content + notice +
      '<footer class="foot">' + (rel.length ? '<h3>同一类的其他章节</h3><div class="rel">' + rel.map(function (x) { return '<a href="#ch' + x.no + '">' + esc(x.title) + '</a>'; }).join('') + '</div>' : '') +
      '<nav class="pn" aria-label="上一章 / 下一章">' + (pn.prev ? '<a class="prev" href="#ch' + pn.prev.no + '"><small>‹ 上一章</small><b>' + esc(pn.prev.title) + '</b></a>' : '<span></span>') +
      (pn.next ? '<a class="next" href="#ch' + pn.next.no + '"><small>下一章 ›</small><b>' + esc(pn.next.title) + '</b></a>' : '') + '</nav></footer></article>' +
      (toc.length > 1 ? '<nav class="otp" aria-label="本页目录"><b>' + ICON.list + '本页目录</b>' + toc.map(function (x) { return '<a href="#ch' + no + '" data-goto="' + x.id + '">' + esc(x.text.replace(/^每月\s*(\d+)\s*号\s*[—\-–]*\s*/, '$1号 ')) + '</a>'; }).join('') + '</nav>' : '') + '</div>';
  }
  // 右边本页目录：点了捲到那一节（不改网址）；捲到哪一节就亮哪一节
  var otpIO = null;
  function watchOtp() {
    if (otpIO) otpIO.disconnect(); otpIO = null;
    var links = document.querySelectorAll('.otp a'); if (!links.length || !('IntersectionObserver' in window)) return;
    otpIO = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) links.forEach(function (a) { a.classList.toggle('on', a.getAttribute('data-goto') === e.target.id); }); }); }, { rootMargin: '-90px 0px -70% 0px' });
    document.querySelectorAll('.sect-h').forEach(function (h) { otpIO.observe(h); });
  }
  // ---------- 切换页面 ----------
  function route() {
    if (!HB) return;
    var m = location.hash.match(/^#ch(\d+)$/), no = m ? Number(m[1]) : null;
    if (no && chap(no)) { $('out').innerHTML = article(no); visit(no); updateHelpers(); watchOtp(); window.scrollTo(0, 0); var h = $('artH'); h.tabIndex = -1; h.focus({ preventScroll: true }); document.title = chap(no).title + ' · 客服手册'; }
    else { $('out').innerHTML = home(); results(); watchOtp(); document.title = '客服手册'; }
  }
  window.addEventListener('hashchange', route);
  document.addEventListener('input', function (e) {
    if (e.target.id === 'q') { Q = e.target.value.trim(); results(); }
    if (/^(dlP|dlD|tnT|tnD)$/.test(e.target.id)) updateHelpers();
  });
  function copy(text, btn) {
    var done = function () { var o = btn.innerHTML; btn.textContent = '已复制'; btn.classList.add('copied'); setTimeout(function () { btn.innerHTML = o; btn.classList.remove('copied'); }, 1400); };
    var fallback = function () { var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (e) {} t.remove(); if (ok) done(); else alert('复制失败，请手动选取'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  }
  document.addEventListener('click', function (e) {
    var hot = e.target.closest('[data-hot]');
    if (hot) { e.preventDefault(); $('q').value = Q = hot.getAttribute('data-hot'); results(); $('res').scrollIntoView({ block: 'nearest' }); return; }
    var go = e.target.closest('[data-goto]');
    if (go) { e.preventDefault(); var el = $(go.getAttribute('data-goto')); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    var b = e.target.closest('[data-text],[data-copy],#favBtn,#wideBtn'); if (!b) return;
    if (b.id === 'favBtn') {
      var no = Number(location.hash.slice(3)), f = favs(), i = f.indexOf(no); if (!Number.isInteger(no)) return;
      if (i >= 0) f.splice(i, 1); else f.unshift(no); store.set('man-fav', f);
      b.setAttribute('aria-pressed', i < 0); b.innerHTML = ICON.star + (i < 0 ? '已收藏' : '收藏'); return;
    }
    if (b.id === 'wideBtn') {
      var w = !store.get('man-wide', false); store.set('man-wide', w);
      $('read').classList.toggle('wide', w); b.setAttribute('aria-pressed', w); b.innerHTML = ICON.side + (w ? '显示目录' : '收起目录'); return;
    }
    if (b.hasAttribute('data-copy')) { copy($(b.getAttribute('data-copy')).textContent, b); return; }
    var text = b.getAttribute('data-text');
    if ($('scO')) text = MANUAL.fillScript(text, { order: $('scO').value, name: $('scN').value, date: $('scD').value });
    copy(text, b);
  });

  // 内容只在云端（要登入），拿不到就说清楚怎么办
  function errorBox(msg) { return '<div class="card pad error lock" role="alert"><p>' + esc(msg) + '</p><button type="button" class="btn" onclick="location.reload()">重新整理</button></div>'; }
  var timer = setTimeout(function () { if (!HB) $('out').innerHTML = errorBox('云端一直没回应，可能是网络不稳。'); }, 15000);
  (window.HQAuth && HQAuth.cloudGet ? HQAuth.cloudGet('handbook') : Promise.resolve(null)).then(function (d) {
    clearTimeout(timer);
    if (!d || !d.chapters || !d.chapters.length) {
      $('out').innerHTML = '<div class="card pad lock" role="alert"><h2>客服手册要登入后才能看</h2><p class="small">手册内容只放在云端，不放在网站文件里。登入时网络不稳，就会拿不到。请退出再登入一次；还是不行就找组长。</p><button type="button" class="btn g-btn3d" onclick="HQAuth.confirmLogout()">退出，重新登入</button></div>';
      return;
    }
    d.chapters = d.chapters.filter(function (c) { return c && Number.isInteger(c.no) && Array.isArray(c.blocks); });
    HB = d; route();
  }).catch(function (err) { clearTimeout(timer); console.error(err); $('out').innerHTML = errorBox('手册的资料格式读不出来。请重新整理；还是不行就找组长。'); });
})();
</script>
</body>
</html>
