<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>客服手册</title>
<meta name="robots" content="noindex, nofollow">
<script src="../hq/auth.js" data-nobadge></script>
<script src="../hq/bus.js"></script>
<style>
/* 客服手册：跟名字审核、技术单审核、保健品分督导同一套（米色底、金色重点、水墨左栏）。内容只在登入后从云端载入 */
:root{--bg:#F6F1E7;--surface:#FFFDF8;--sunk:#F3ECDF;--ink:#2B2620;--muted:#6F6553;--faint:#7A6F5C;--line:#E8DFCC;--line-soft:#F0E9DB;--field:#DCCFB4;
  --accent:#9A6B22;--accent-hover:#7E5718;--accent-soft:#F6ECD9;--accent-ink:#6E4B12;--on-accent:#FFFFFF;--crit:#B3261E;--crit-bg:#FBE9E7;--ok:#137333;--ok-bg:#E6F4EA;--warn:#7A4300;--warn-bg:#FFF1DC;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background-color:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{margin:0;line-height:1.3}
p{margin:0}
.shell{min-height:100vh}
.side{display:none}
@media (min-width:1000px){
  .shell{display:grid;grid-template-columns:240px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 12px}
}
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px}
@media (min-width:720px){.top-in{padding:14px 28px}}
.top .sub{font-size:13px;color:var(--muted)}
.top-r{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.home{font-size:13px;color:var(--muted);text-decoration:none}
@media (min-width:1000px){.ph-only{display:none!important}}
@media (max-width:999px){.desk-only{display:none!important}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid var(--field);border-radius:10px;background:var(--surface);color:var(--ink);font-weight:500;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:default}
.page{max-width:1120px;margin:0 auto;padding:24px 16px 80px;display:flex;flex-direction:column;gap:20px}
@media (min-width:720px){.page{padding:28px 28px 60px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 24px -18px rgba(110,75,18,.4)}
.pad{padding:18px 22px}
.small{font-size:13px;color:var(--muted)}
.status{display:flex;align-items:center;gap:10px;color:var(--accent-ink)}
.error{background:var(--crit-bg);color:#8C1D18}
.lock{display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.lock h2{font-size:17px}
.ic{width:22px;height:22px;flex:none}
/* ---------- 首页 ---------- */
.home-hero{padding-bottom:26px}
.home-hero h2{display:flex;align-items:center;gap:14px}
.home-hero h2 .ic{width:46px;height:46px;color:var(--accent)}
.bigsearch{position:relative;max-width:640px;margin-top:18px}
.bigsearch input{width:100%;min-height:52px;padding:0 128px 0 46px;border:1px solid var(--field);border-radius:999px;background:var(--surface);font:inherit;font-size:16px;box-shadow:0 8px 22px -16px rgba(110,75,18,.45)}
.bigsearch .ic{position:absolute;left:16px;top:15px;color:var(--faint)}
.bigsearch button{position:absolute;right:5px;top:5px;min-height:42px;border-radius:999px;padding:0 22px}
.hot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:12px;font-size:13px;color:var(--muted)}
.hot a{color:var(--accent-ink);text-decoration:none;padding:2px 10px;border-radius:999px;background:rgba(255,253,248,.7);border:1px solid var(--line)}
.hot a:hover{border-color:var(--accent)}
.sec-h{display:flex;align-items:center;gap:10px;font-family:var(--g-brush);font-weight:700;font-size:19px;color:var(--ink)}
.sec-h .ic{color:var(--accent)}
.sec-h .count{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:2px 10px}
.cats{display:grid;gap:20px}
@media (min-width:720px){.cats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1200px){.cats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cat{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px;padding:18px 22px;text-decoration:none;color:inherit;background:linear-gradient(135deg,var(--surface) 55%,var(--accent-soft));transition:transform .15s,box-shadow .15s}
.cat:hover{transform:translateY(-2px);box-shadow:0 16px 30px -18px rgba(110,75,18,.55)}
.cat .t{display:flex;align-items:center;gap:12px;font-family:var(--g-brush);font-weight:700;font-size:18px}
.cat .t .ic{width:30px;height:30px;color:var(--accent)}
.cat .d{font-size:13px;color:var(--muted);line-height:1.6;min-height:42px}
.cat .n{align-self:flex-start;font-size:13px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);border:1px solid var(--line);border-radius:999px;padding:3px 12px}
.cat .wm{position:absolute;right:-10px;bottom:-16px;color:var(--accent);opacity:.1;pointer-events:none}
.cat .wm .ic{width:104px;height:104px}
.trio{display:grid;gap:20px}
@media (min-width:1000px){.trio{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mini{display:flex;flex-direction:column;gap:10px}
.mini h3{display:flex;align-items:center;gap:8px;font-family:var(--g-brush);font-weight:700;font-size:16px}
.mini h3 .ic{width:20px;height:20px;color:var(--accent)}
.mini ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.mini li a{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line-soft);color:var(--ink);text-decoration:none;font-size:14px}
.mini li:first-child a{border-top:0}
.mini li a:hover{color:var(--accent-ink)}
.mini .when{font-size:12px;color:var(--faint);white-space:nowrap}
.mini .empty{font-size:13px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.quick a{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none;font-size:14px;background:var(--surface)}
.quick a:hover{border-color:var(--accent)}
.quick a .ic{width:18px;height:18px;color:var(--accent)}
.results{display:flex;flex-direction:column}
.results a{display:flex;flex-direction:column;gap:4px;padding:14px 22px;border-top:1px solid var(--line-soft);text-decoration:none;color:inherit}
.results a:first-child{border-top:0}
.results a:hover{background:var(--sunk)}
.results .rt{font-weight:600}
.results .rt span{color:var(--faint);font-weight:400;margin-right:6px}
.results .rs{font-size:13px;color:var(--muted)}
/* ---------- 文章页 ---------- */
.read{display:grid;gap:20px;align-items:start}
@media (min-width:1000px){.read{grid-template-columns:250px minmax(0,1fr)}.read.wide{grid-template-columns:minmax(0,1fr)}.read.wide .hbnav{display:none}}
.hbnav{padding:18px 16px;display:flex;flex-direction:column;gap:4px}
@media (min-width:1000px){.hbnav{position:sticky;top:96px;max-height:calc(100vh - 116px);overflow-y:auto}}
.hbnav .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 6px 8px}
.hbnav .hd b{font-family:var(--g-brush);font-size:16px}
.hbnav .hd .count{font-size:12px;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:1px 8px}
.hbnav details{border-top:1px solid var(--line-soft)}
.hbnav summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:40px;padding:0 6px;cursor:pointer;font-weight:600;font-size:14px}
.hbnav summary::-webkit-details-marker{display:none}
.hbnav summary .ic{width:18px;height:18px;color:var(--accent)}
.hbnav summary .k{margin-left:auto;font-weight:400;font-size:12px;color:var(--faint)}
.hbnav summary::after{content:"";width:7px;height:7px;border-right:1.6px solid var(--faint);border-bottom:1.6px solid var(--faint);transform:rotate(45deg);margin:0 4px 3px}
.hbnav details[open] summary::after{transform:rotate(-135deg);margin-bottom:-3px}
.hbnav details a{display:block;padding:6px 10px 6px 32px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.45}
.hbnav details a:hover{background:var(--sunk)}
.hbnav details a[aria-current]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.hbnav .homelink{display:flex;align-items:center;gap:8px;padding:8px 6px;color:var(--accent-ink);text-decoration:none;font-size:14px;font-weight:600}
.art{display:flex;flex-direction:column;gap:20px;min-width:0}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.crumb a{color:var(--muted);text-decoration:none}
.crumb a:hover{color:var(--accent-ink)}
.ahead{display:flex;flex-direction:column;gap:12px;padding:20px 22px}
.ahead .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.ahead h2{font-family:var(--sans);font-weight:700;font-size:26px;color:var(--ink);display:flex;align-items:center;gap:12px}
.ahead h2 .num{display:inline-grid;place-items:center;min-width:40px;height:40px;padding:0 6px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);font:700 18px/1 var(--sans)}
.pill{display:inline-flex;align-items:center;min-height:28px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--line);color:var(--accent-ink);background:var(--surface)}
.pill.solid{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ahead .meta{font-size:13px;color:var(--muted)}
.ahead .tools-r{margin-left:auto;display:flex;gap:8px}
.star[aria-pressed="true"]{color:var(--accent-ink);border-color:var(--accent);background:var(--accent-soft)}
.star svg{width:18px;height:18px}
.star[aria-pressed="true"] svg{fill:currentColor}
.sec{display:flex;flex-direction:column;gap:14px;padding:18px 22px 20px}
.sec>h3{display:flex;align-items:center;gap:10px;font-family:var(--g-brush);font-weight:700;font-size:17px;color:var(--accent-ink)}
.sec>h3 .ic{color:var(--accent)}
.sec h4{margin:4px 0 0;font-size:15px;color:var(--accent-ink)}
/* 流程图：圆角 = 开始 / 结束，方框 = 步骤，菱形 = 判断，箭头 = 方向；金色主流程、琥珀色例外、绿色完成 */
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 0;padding:6px 2px}
.fn{display:flex;align-items:center}
.fn+.fn::before{content:"";width:22px;height:2px;background:var(--accent);margin:0 2px 0 4px}
.fn+.fn::after{content:"";order:-1}
.node{position:relative;max-width:180px;min-height:52px;padding:10px 12px;border:1.5px solid var(--accent);border-radius:10px;background:var(--surface);font-size:13px;line-height:1.45;display:flex;align-items:center;gap:8px}
.node .no{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:700;flex:none}
.node .tx{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.node.start,.node.end{border-radius:999px;min-height:40px;padding:0 18px;font-weight:700}
.node.start{background:var(--accent-soft);color:var(--accent-ink)}
.node.end{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.arr{display:inline-block;width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:7px solid var(--accent);margin-right:4px}
.dec{display:flex;flex-direction:column;align-items:center;gap:6px}
.dia{width:118px;height:118px;display:grid;place-items:center;position:relative}
.dia::before{content:"";position:absolute;inset:16px;transform:rotate(45deg);border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:6px}
.dia span{position:relative;font-size:12.5px;line-height:1.35;text-align:center;max-width:84px}
.dec .yes{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--warn)}
.dec .yes::before{content:"";width:2px;height:14px;background:var(--warn)}
.dec .yes .node{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.flow-note{display:flex;gap:8px;align-items:flex-start;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start}
.steps li::before{content:counter(s,decimal-leading-zero);display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:700}
.steps li.n{counter-increment:none}
.steps li.n::before{content:"!";background:var(--warn)}
.bul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.bul li::marker{color:var(--accent)}
.quote{border-left:3px solid var(--accent);padding:2px 0 2px 12px}
.notice{background:var(--warn-bg);border:1px solid #F2D7A6}
.notice>h3,.notice>h3 .ic{color:var(--warn)}
.notice ul{margin:0;padding-left:20px;color:#5C3A00;display:flex;flex-direction:column;gap:4px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 14px;text-align:left;border-top:1px solid var(--line-soft);vertical-align:top}
thead th{background:var(--sunk);font-size:13px;color:var(--muted);font-weight:700;border-top:0;white-space:nowrap}
.tbl td:first-child{min-width:7em}
td .money{font-weight:700;color:var(--accent-ink);white-space:nowrap}
td.act{width:1%;white-space:nowrap}
.url{overflow-wrap:anywhere;color:var(--muted);font-size:13px}
.helper{display:flex;flex-direction:column;gap:12px;background:var(--accent-soft);border-radius:12px;padding:14px 16px}
.helper b{color:var(--accent-ink)}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.field input,.field select{width:100%;min-height:40px;padding:0 10px;border:1px solid var(--field);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:15px}
.row3{display:grid;gap:10px}
@media (min-width:600px){.row3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.answer{font-weight:700;color:var(--accent-ink);overflow-wrap:anywhere}
.pn{display:grid;gap:12px}
@media (min-width:720px){.pn{grid-template-columns:1fr 1fr}}
.pn a{display:flex;flex-direction:column;gap:2px;padding:14px 18px;text-decoration:none;color:inherit}
.pn a.next{text-align:right}
.pn small{color:var(--muted)}
.pn b{color:var(--accent-ink)}
.rel ul{list-style:none;margin:0;padding:0}
.rel a{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line-soft);color:var(--ink);text-decoration:none;font-size:14px}
.rel li:first-child a{border-top:0}
mark{background:#FBE7B5;color:inherit;border-radius:3px;padding:0 1px}
.copied{color:var(--ok)}
@media (max-width:999px){.top{position:static}.read .hbnav{order:2}}
@media (max-width:480px){.bigsearch input{padding-right:16px}.bigsearch button{display:none}.ahead h2{font-size:23px}}
</style>

</head>

    clock: SV + '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',

      '<form class="bigsearch" role="search" onsubmit="return false"><label class="vh" for="q">搜索客服手册</label>' + ICON.search +
      '<input id="q" type="search" placeholder="搜索业务名称、流程、操作步骤、规则……" autocomplete="off" value="' + esc(Q) + '"><button type="submit" class="btn g-btn3d">搜索</button></form>' +
      '<p class="hot">热门搜索：' + HOT.map(function (n) { var c = chap(n); return c ? '<a href="#" data-hot="' + esc(c.title.replace(/（.*$/, '')) + '">' + esc(c.title.replace(/（.*$/, '')) + '</a>' : ''; }).join('') + '</p></section>' +
      '<div id="res"></div>' +

      '<div class="cats">' + cats + '</div>' +

      '<span class="tools-r"><button type="button" class="btn small" id="wideBtn" aria-pressed="' + wide + '">' + ICON.side + (wide ? '显示目录' : '收起目录') + '</button>' +
      '<button type="button" class="btn small star" id="favBtn" aria-pressed="' + fav + '">' + ICON.star + (fav ? '已收藏' : '收藏') + '</button></span></div>' +
      '<div class="row"><span class="pill solid">' + esc(k) + '</span>' + (g ? '<span class="pill">' + esc(g.name) + '</span>' : '') + '<span class="meta">手册整理日期 ' + esc(HB.updated || '') + '</span></div></header>' +
      main + notice + related +
      '<nav class="pn" aria-label="上一章 / 下一章">' + (pn.prev ? '<a class="card prev" href="#ch' + pn.prev.no + '"><small>‹ 上一章</small><b>' + esc(pn.prev.title) + '</b></a>' : '<span></span>') +
      (pn.next ? '<a class="card next" href="#ch' + pn.next.no + '"><small>下一章 ›</small><b>' + esc(pn.next.title) + '</b></a>' : '') + '</nav></article></div>';
  }

  // ---------- 切换页面 ----------
  function route() {
    var m = location.hash.match(/^#ch(\d+)$/), no = m ? Number(m[1]) : null;
    if (no && chap(no)) { Q = ''; $('out').innerHTML = article(no); visit(no); updateHelpers(); window.scrollTo(0, 0); document.title = chap(no).title + ' · 客服手册'; }
    else { $('out').innerHTML = home(); results(); document.title = '客服手册'; }
  }
  window.addEventListener('hashchange', route);
  document.addEventListener('input', function (e) {
    if (e.target.id === 'q') { Q = e.target.value.trim(); results(); }
    if (/^(dlP|dlD|tnT|tnD)$/.test(e.target.id)) updateHelpers();
  });
  function copy(text, btn) {
    var done = function () { var o = btn.innerHTML; btn.textContent = '已复制'; btn.classList.add('copied'); setTimeout(function () { btn.innerHTML = o; btn.classList.remove('copied'); }, 1400); };
    var fallback = function () { var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (e) {} t.remove(); if (ok) done(); else alert('复制失败，请手动选取'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  }
  document.addEventListener('click', function (e) {
    var hot = e.target.closest('[data-hot]');
    if (hot) { e.preventDefault(); $('q').value = Q = hot.getAttribute('data-hot'); results(); $('res').scrollIntoView({ block: 'nearest' }); return; }
    var b = e.target.closest('[data-text],[data-copy],#favBtn,#wideBtn'); if (!b) return;
    if (b.id === 'favBtn') {
      var no = Number(location.hash.slice(3)), f = favs(), i = f.indexOf(no);
      if (i >= 0) f.splice(i, 1); else f.unshift(no); store.set('man-fav', f);
      b.setAttribute('aria-pressed', i < 0); b.innerHTML = ICON.star + (i < 0 ? '已收藏' : '收藏'); return;
    }
    if (b.id === 'wideBtn') {
      var w = !store.get('man-wide', false); store.set('man-wide', w);
      $('read').classList.toggle('wide', w); b.setAttribute('aria-pressed', w); b.innerHTML = ICON.side + (w ? '显示目录' : '收起目录'); return;
    }
    if (b.hasAttribute('data-copy')) { copy($(b.getAttribute('data-copy')).textContent, b); return; }
    var text = b.getAttribute('data-text');
    if ($('scO')) text = MANUAL.fillScript(text, { order: $('scO').value, name: $('scN').value, date: $('scD').value });
    copy(text, b);
  });

  // 内容只在云端（要登入），拿不到就说清楚怎么办
  function errorBox(msg) { return '<div class="card pad error lock" role="alert"><p>' + esc(msg) + '</p><button type="button" class="btn" onclick="location.reload()">重新整理</button></div>'; }
  var timer = setTimeout(function () { if (!HB) $('out').innerHTML = errorBox('云端一直没回应，可能是网络不稳。'); }, 15000);
  (window.HQAuth && HQAuth.cloudGet ? HQAuth.cloudGet('handbook') : Promise.resolve(null)).then(function (d) {
    clearTimeout(timer);
    if (!d || !d.chapters || !d.chapters.length) {
      $('out').innerHTML = '<div class="card pad lock" role="alert"><h2>客服手册要登入后才能看</h2><p class="small">手册内容只放在云端，不放在网站文件里。登入时网络不稳，就会拿不到。请退出再登入一次；还是不行就找组长。</p><button type="button" class="btn g-btn3d" onclick="HQAuth.confirmLogout()">退出，重新登入</button></div>';
      return;
    }
    HB = d; route();
  }).catch(function () { clearTimeout(timer); $('out').innerHTML = errorBox('手册的资料格式读不出来。请重新整理；还是不行就找组长。'); });
})();
</script>
</body>
</html>
