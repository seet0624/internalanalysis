<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>业务流程手册</title>
<meta name="robots" content="noindex, nofollow">
<script src="../hq/auth.js" data-nobadge></script>
<script src="../hq/bus.js"></script>
<style>
/* 业务流程手册：跟名字审核、技术单审核、保健品分督导同一套（米色底、金色重点、水墨左栏）。内容只在登入后从云端载入 */
:root{--bg:#F6F1E7;--surface:#FFFDF8;--sunk:#F3ECDF;--ink:#2B2620;--muted:#6F6553;--faint:#7A6F5C;--line:#E8DFCC;--line-soft:#F0E9DB;--field:#DCCFB4;
  --accent:#9A6B22;--accent-hover:#7E5718;--accent-soft:#F6ECD9;--accent-ink:#6E4B12;--on-accent:#FFFFFF;--crit:#B3261E;--crit-bg:#FBE9E7;--ok:#137333;--ok-bg:#E6F4EA;--warn:#7A4300;--warn-bg:#FFF1DC;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background-color:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{margin:0;line-height:1.3}
p{margin:0}
.shell{min-height:100vh}
.side{display:none}
@media (min-width:1000px){
  .shell{display:grid;grid-template-columns:240px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 12px}
}
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px}
@media (min-width:720px){.top-in{padding:14px 28px}}
.top .sub{font-size:13px;color:var(--muted)}
.top-r{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.home{font-size:13px;color:var(--muted);text-decoration:none}
@media (min-width:1000px){.ph-only{display:none!important}}
@media (max-width:999px){.desk-only{display:none!important}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid var(--field);border-radius:10px;background:var(--surface);color:var(--ink);font-weight:500;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:default}
.page{max-width:1120px;margin:0 auto;padding:24px 16px 80px;display:flex;flex-direction:column;gap:20px}
@media (min-width:720px){.page{padding:28px 28px 60px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 24px -18px rgba(110,75,18,.4)}
.pad{padding:18px 22px}
.small{font-size:13px;color:var(--muted)}
.status{display:flex;align-items:center;gap:10px;color:var(--accent-ink)}
.error{background:var(--crit-bg);color:#8C1D18;border-radius:12px;padding:12px 16px}
.lock{display:flex;flex-direction:column;align-items:flex-start;gap:12px}
/* 常用工具：三张卡 */
.tools{display:grid;gap:16px}
@media (min-width:900px){.tools{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)}.tools .wide{grid-column:2;grid-row:1 / span 2}}
.tool{display:flex;flex-direction:column;gap:12px}
.tool h3{font-family:var(--g-brush);font-weight:700;font-size:17px;color:var(--accent-ink);display:flex;align-items:center;gap:8px}
.tool h3 svg{width:20px;height:20px;flex:none}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select{min-height:40px;padding:0 10px;border:1px solid var(--field);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:15px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.field input,.field select{width:100%;min-width:0}
.tool .act-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.answer{background:var(--accent-soft);border-radius:10px;padding:10px 12px;color:var(--accent-ink);font-weight:600;overflow-wrap:anywhere}
.answer .small{font-weight:400}
.scripts{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto;margin:0;padding:0;list-style:none}
.scripts li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line-soft)}
.scripts li:first-child{border-top:0}
/* 手册：左边章节，右边内容 */
.book{display:grid;gap:20px;align-items:start}
@media (min-width:900px){.book{grid-template-columns:240px minmax(0,1fr)}}
.toc{display:flex;flex-direction:column;gap:12px;padding:16px}
@media (min-width:900px){.toc{position:sticky;top:96px;max-height:calc(100vh - 116px);overflow-y:auto}}
.search{position:relative}
.search input{width:100%;min-height:40px;padding:0 12px 0 36px;border:1px solid var(--field);border-radius:10px;background:var(--surface);font:inherit;font-size:15px}
.search svg{position:absolute;left:11px;top:11px;width:18px;height:18px;color:var(--faint)}
.toc .grp{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--faint);margin:6px 0 2px}
.toc a{display:flex;gap:8px;align-items:baseline;padding:6px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.4}
.toc a:hover{background:var(--sunk)}
.toc a.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.toc a .no{color:var(--faint);font-variant-numeric:tabular-nums;min-width:1.6em}
.toc .miss{font-size:13px;color:var(--muted);padding:6px 10px}
.chapters{display:flex;flex-direction:column;gap:20px;min-width:0}
.ch{scroll-margin-top:96px}
.ch>header{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line-soft)}
.ch>header .num{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.ch>header h2{font-size:19px}
.ch .body{padding:16px 22px 20px;display:flex;flex-direction:column;gap:14px}
.ch h3{font-size:15px;color:var(--accent-ink);padding-top:4px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px}
.quote{border-left:3px solid var(--accent);padding:2px 0 2px 12px;color:var(--ink)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:8px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.steps li::before{content:counter(s);display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:13px;font-weight:700}
.bul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.bul li::marker{color:var(--accent)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 14px;text-align:left;border-top:1px solid var(--line-soft);vertical-align:top}
thead th{background:var(--sunk);font-size:13px;color:var(--muted);font-weight:700;border-top:0;white-space:nowrap}
td .money{font-weight:700;color:var(--accent-ink);white-space:nowrap}
td.act{width:1%;white-space:nowrap}
.url{overflow-wrap:anywhere;color:var(--muted);font-size:13px}
mark{background:#FBE7B5;color:inherit;border-radius:3px;padding:0 1px}
.copied{color:var(--ok)}
</style>

</head>

<script src="manual.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var store = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  var ICON = {
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
    file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>',
    chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a7.5 7.5 0 0 1-11 6.6L4 20l1.4-4.4A7.5 7.5 0 1 1 20 12z"/></svg>',
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>'
  };
  try { var _s = HQAuth.session(); if (_s) $('gUser').textContent = _s.id; } catch (e) {}

  var HB = null, Q = '';
  function chapterNo(no) { return HB.chapters.filter(function (c) { return c.no === no; })[0]; }
  function firstTable(c) { return c && c.blocks.filter(function (b) { return b.type === 'table'; })[0]; }
  function tableByHead(word) {
    for (var i = 0; i < HB.chapters.length; i++) { var bs = HB.chapters[i].blocks; for (var j = 0; j < bs.length; j++) if (bs[j].type === 'table' && MANUAL.rowsOf(bs[j]).head.join('|').indexOf(word) >= 0) return bs[j]; }
    return null;
  }
  // 搜索的字标出来（先转义再标，不会插进 HTML）
  function hl(s) {
    var t = esc(s); if (!Q) return t;
    Q.split(/\s+/).filter(Boolean).forEach(function (w) { var e = esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); t = t.replace(new RegExp(e, 'gi'), function (m) { return '<mark>' + m + '</mark>'; }); });
    return t;
  }
  function cell(s) {
    var u = MANUAL.urlOf(s);
    if (u && /^https?:\/\//.test(u)) return '<span class="url">' + hl(s) + '</span>';
    return hl(s).replace(/RMB\s?\d[\d,.]*/g, function (m) { return '<span class="money">' + m + '</span>'; });
  }

  // ---------- 三个常用工具 ----------
  function tools() {
    var t1 = firstTable(chapterNo(1)), t9 = tableByHead('命名示例'), t2 = tableByHead('话术');
    var today = MANUAL.iso(new Date()), h = '<section class="tools" aria-label="常用工具">';
    if (t1) {
      var r1 = MANUAL.rowsOf(t1), pi = r1.head.indexOf('产品类型') >= 0 ? r1.head.indexOf('产品类型') : 1, di = r1.head.length - 1;
      h += '<div class="card pad tool"><h3>' + ICON.clock + '回传期限</h3><div class="row2"><label class="field">产品<select id="dlP">' +
        r1.rows.map(function (r) { return '<option value="' + esc(MANUAL.days(r[di])) + '">' + esc(r[pi]) + '（' + esc(r[di]) + '）</option>'; }).join('') +
        '</select></label><label class="field">从哪天算<input id="dlD" type="date" value="' + today + '"></label></div><p class="answer" id="dlA"></p></div>';
    }
    if (t9) {
      var r9 = MANUAL.rowsOf(t9), ei = r9.head.indexOf('命名示例');
      h += '<div class="card pad tool"><h3>' + ICON.file + '技术单命名</h3><div class="row2"><label class="field">类型<select id="tnT">' +
        r9.rows.map(function (r) { return '<option value="' + esc(r[ei]) + '">' + esc(r[0]) + '</option>'; }).join('') +
        '</select></label><label class="field">日期<input id="tnD" value="' + today + '" aria-describedby="tnH"></label></div>' +
        '<p class="answer" id="tnA"></p><div class="act-row"><span class="small" id="tnH">三天一次的写成 2026-10-03&amp;05&amp;06</span><button type="button" class="btn small" data-copy="tnA">复制文件名</button></div></div>';
    }
    if (t2) {
      var r2 = MANUAL.rowsOf(t2), si = r2.head.indexOf('话术示例') >= 0 ? r2.head.indexOf('话术示例') : 1;
      h += '<div class="card pad tool wide"><h3>' + ICON.chat + '话术一键复制</h3><div class="row2"><label class="field">订单号<input id="scO" autocomplete="off"></label><label class="field">姓名<input id="scN" autocomplete="off"></label></div>' +
        '<label class="field">日期<input id="scD" type="date" value="' + today + '"></label><ul class="scripts">' +
        r2.rows.map(function (r, i) { return '<li><span>' + esc(r[0]) + '</span><button type="button" class="btn small" data-script="' + i + '">复制</button></li>'; }).join('') + '</ul></div>';
      tools.scripts = r2.rows.map(function (r) { return r[si]; });
    }
    return h + '</section>';
  }
  function updateTools() {
    if ($('dlP')) {
      var n = $('dlP').value === '' ? null : Number($('dlP').value), r = MANUAL.deadline($('dlD').value, n);
      $('dlA').innerHTML = r ? '最晚 ' + esc(r.date) + '（星期' + esc(r.week) + '）回传' : '<span class="small">先选日期</span>';
    }
    if ($('tnT')) $('tnA').textContent = MANUAL.techName($('tnT').value, $('tnD').value);
  }

  // ---------- 章节 ----------
  function block(b, ci) {
    if (b.type === 'h') return '<h3>' + hl(b.text) + '</h3>';
    if (b.type === 'p') return /^(注意|特别注意|前提|时间)[：:]/.test(b.text) ? '<p class="note">' + hl(b.text) + '</p>' : '<p class="quote">' + hl(b.text) + '</p>';
    if (b.type === 'ol') return '<ol class="steps">' + b.items.map(function (x) { return '<li><span>' + hl(x) + '</span></li>'; }).join('') + '</ol>';
    if (b.type === 'ul') return '<ul class="bul">' + b.items.map(function (x) { return '<li>' + hl(x) + '</li>'; }).join('') + '</ul>';
    if (b.type === 'table') {
      var t = MANUAL.rowsOf(b), si = -1;
      t.head.forEach(function (h, i) { if (/话术/.test(h)) si = i; });
      var links = t.rows.some(function (r) { return r.some(function (c) { return MANUAL.urlOf(c); }); });
      return '<div class="tbl"><table><thead><tr>' + t.head.map(function (h) { return '<th scope="col">' + esc(h) + '</th>'; }).join('') + (si >= 0 || links ? '<th scope="col"><span class="vh">操作</span></th>' : '') + '</tr></thead><tbody>' +
        t.rows.map(function (r) {
          var u = null; r.forEach(function (c) { u = u || MANUAL.urlOf(c); });
          var act = si >= 0 ? '<td class="act"><button type="button" class="btn small" data-text="' + esc(r[si]) + '">复制</button></td>'
            : links ? '<td class="act">' + (u ? '<a class="btn small" href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">打开</a>' : '') + '</td>' : '';
          return '<tr>' + r.map(function (c) { return '<td>' + cell(c) + '</td>'; }).join('') + act + '</tr>';
        }).join('') + '</tbody></table></div>';
    }
    return '';
  }
  function chapters(nos) {
    return HB.chapters.filter(function (c) { return !nos || nos.indexOf(c.no) >= 0; }).map(function (c) {
      return '<article class="card ch" id="ch' + c.no + '"><header><span class="num">' + c.no + '</span><h2>' + hl(c.title) + '</h2></header><div class="body">' + c.blocks.map(block).join('') + '</div></article>';
    }).join('') || '<div class="card pad small">找不到「' + esc(Q) + '」。换个字再搜，例如「戒指」「二次命名」「费用」。</div>';
  }
  function toc(nos) {
    return MANUAL.groups(HB).map(function (g) {
      var chs = g.chapters.filter(function (c) { return !nos || nos.indexOf(c.no) >= 0; });
      if (!chs.length) return '';
      return '<div class="grp">' + esc(g.name) + '</div>' + chs.map(function (c) { return '<a href="#ch' + c.no + '" data-no="' + c.no + '"><span class="no">' + c.no + '</span><span>' + esc(c.title) + '</span></a>'; }).join('');
    }).join('');
  }
  function renderBook() {
    var nos = MANUAL.search(HB, Q);
    $('tocList').innerHTML = toc(nos) || '<p class="miss">没有符合的章节</p>';
    $('chs').innerHTML = chapters(nos);
    $('hits').textContent = nos ? '找到 ' + nos.length + ' 章' : '共 ' + HB.chapters.length + ' 章';
    watch();
  }

  // 看到哪一章，左边就亮哪一章；也记住，下次打开回到这里
  var io = null;
  function watch() {
    if (io) io.disconnect(); if (!('IntersectionObserver' in window)) return;
    io = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) return; var no = e.target.id.slice(2);
        document.querySelectorAll('#tocList a').forEach(function (a) { var on = a.getAttribute('data-no') === no; a.classList.toggle('on', on); if (on) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current'); });
        if (!Q) store.set('man-last', no);
      });
    }, { rootMargin: '-100px 0px -65% 0px' });
    document.querySelectorAll('.ch').forEach(function (el) { io.observe(el); });
  }

  function render() {
    $('upd').textContent = '整理日期 ' + (HB.updated || '') + ' · 共 ' + HB.chapters.length + ' 章 · 只在登入后从云端载入';
    $('out').innerHTML = tools() +
      '<div class="book"><nav class="card toc" aria-label="手册章节"><label class="search"><span class="vh">搜索手册</span>' + ICON.search + '<input id="q" type="search" placeholder="搜索手册，例如 戒指 尺寸" autocomplete="off"></label><span class="small" id="hits"></span><div id="tocList"></div></nav>' +
      '<div class="chapters" id="chs"></div></div>';
    renderBook(); updateTools();
    var last = location.hash || (store.get('man-last') ? '#ch' + store.get('man-last') : '');
    if (last && document.querySelector(last)) document.querySelector(last).scrollIntoView();
    $('q').addEventListener('input', function () { Q = this.value.trim(); renderBook(); });
    ['dlP', 'dlD', 'tnT', 'tnD'].forEach(function (id) { if ($(id)) $(id).addEventListener('input', updateTools); });
  }

  // 复制：表里的话术、命名、上面的话术（套进订单号、姓名、日期）
  function copy(text, btn) {
    var done = function () { var o = btn.textContent; btn.textContent = '已复制'; btn.classList.add('copied'); setTimeout(function () { btn.textContent = o; btn.classList.remove('copied'); }, 1400); };
    var fallback = function () { var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); done(); } catch (e) { alert('复制失败，请手动选取'); } t.remove(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-text],[data-copy],[data-script]'); if (!b) return;
    if (b.hasAttribute('data-text')) copy(b.getAttribute('data-text'), b);
    else if (b.hasAttribute('data-copy')) copy($(b.getAttribute('data-copy')).textContent, b);
    else copy(MANUAL.fillScript(tools.scripts[+b.getAttribute('data-script')], { order: $('scO').value, name: $('scN').value, date: $('scD').value }), b);
  });

  // 内容只在云端（要登入），拿不到就说清楚怎么办
  var timer = setTimeout(function () { if (!HB) $('out').innerHTML = '<div class="error" role="alert">云端一直没回应，可能是网络不稳。请稍后重新整理页面。</div>'; }, 15000);
  (window.HQAuth && HQAuth.cloudGet ? HQAuth.cloudGet('handbook') : Promise.resolve(null)).then(function (d) {
    clearTimeout(timer);
    if (!d || !d.chapters || !d.chapters.length) {
      $('out').innerHTML = '<div class="card pad lock" role="alert"><b>手册要登入后才能看</b><p class="small">手册内容只放在云端，不放在网站文件里。登入时网络不稳，就会拿不到。请退出再登入一次；还是不行就找组长。</p><button type="button" class="btn g-btn3d" onclick="HQAuth.confirmLogout()">退出，重新登入</button></div>';
      return;
    }
    HB = d; render();
  });
})();
</script>
</body>
</html>
