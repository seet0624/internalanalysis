<style>
/* 保健品分督导：跟名字审核、技术单审核同一套（米色底、金色重点、水墨左栏） */
:root{--bg:#F6F1E7;--surface:#FFFDF8;--sunk:#F3ECDF;--ink:#2B2620;--muted:#6F6553;--faint:#7A6F5C;--line:#E8DFCC;--line-soft:#F0E9DB;--field:#DCCFB4;
  --accent:#9A6B22;--accent-hover:#7E5718;--accent-soft:#F6ECD9;--accent-ink:#6E4B12;--on-accent:#FFFFFF;--crit:#B3261E;--crit-bg:#FBE9E7;--ok:#137333;--ok-bg:#E6F4EA;--warn:#7A4300;--warn-bg:#FFF1DC;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif}
:root[data-theme="dark"]{--bg:#0F1217;--surface:#161A21;--sunk:#12151B;--ink:#E8EAED;--muted:#9AA7BD;--faint:#6B7385;--line:#2A303C;--line-soft:#1E232C;--field:#343B49;
  --accent:#D4AA5E;--accent-hover:#E2BE7A;--accent-soft:#3A2F1C;--accent-ink:#E9C98A;--on-accent:#1A1916;--crit:#FF8A80;--crit-bg:#3A1C1A;--ok:#7FCC8C;--ok-bg:#183020;--warn:#F2B866;--warn-bg:#33270F;color-scheme:dark}
.theme svg{flex:none}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background-color:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{margin:0;line-height:1.3}
p{margin:0}
.shell{min-height:100vh}
.side{display:none}
@media (min-width:1000px){
  .shell{display:grid;grid-template-columns:240px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 12px}
}
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px}
@media (min-width:720px){.top-in{padding:14px 28px}}
.top .sub{font-size:13px;color:var(--muted)}
.top-r{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.home{font-size:13px;color:var(--muted);text-decoration:none}
@media (min-width:1000px){.ph-only{display:none!important}}
@media (max-width:999px){.desk-only{display:none!important}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid var(--field);border-radius:10px;background:var(--surface);color:var(--ink);font-weight:500;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:default}
.page{max-width:1120px;margin:0 auto;padding:24px 16px 80px;display:flex;flex-direction:column;gap:20px}
@media (min-width:720px){.page{padding:28px 28px 60px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 24px -18px rgba(110,75,18,.4)}
.pad{padding:18px 22px}
.small{font-size:13px;color:var(--muted)}
.drop{position:relative;border-radius:20px;background:var(--surface);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop .fake{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 28px;border-radius:12px;font-size:16px}
.error{background:var(--crit-bg);color:var(--crit);border-radius:12px;padding:12px 16px}
.status{display:flex;align-items:center;gap:10px;color:var(--accent-ink)}
.facts{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:center}
.facts b{font-size:18px}
.facts label{display:inline-flex;align-items:center;gap:8px}
.facts input[aria-invalid="true"]{border-color:var(--crit)}
.facts input{width:64px;min-height:38px;padding:0 10px;border:1px solid var(--field);border-radius:8px;background:var(--surface);text-align:center}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:14px 18px}
.warn ul{margin:6px 0 0;padding-left:20px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:12px 14px;text-align:left;border-top:1px solid var(--line-soft);vertical-align:middle}
thead th{background:var(--sunk);font-size:13px;color:var(--muted);font-weight:700;border-top:0}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.grp{font-family:"ShuyiSerif","Songti SC","SimSun",serif;font-weight:700;font-size:17px}
.fn{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
</style>

<!-- 店铺资料和读写 Excel 的组件很大，选了文件才用到：defer 不挡住画面先出来 -->
<script src="../name/shops.js?v=20261126b" defer></script>
<script src="../vendor/xlsx.full.min.js" defer></script>
<script src="../vendor/exceljs.min.js" defer></script>
<script src="../vendor/jszip.min.js" defer></script>
<script src="split.js?v=20261126b"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var state = null;
  try { var _s = HQAuth.session(); if (_s) { $('gUser').innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>'; $('gUser').appendChild(document.createTextNode(_s.id)); } } catch (e) {}
  HQAuth.themeButton($('theme'));

  async function load(file) {
    if(document.readyState!=='complete') await new Promise(function(r){ addEventListener('load',r,{once:true}); });   // 读 Excel 的组件是 defer：太早拖文件进来就先等它们载完（load 才保证 defer 都跑完）
    $('out').innerHTML = '<div class="status" role="status">正在读「' + esc(file.name) + '」……</div>';
    try {
      if (!window.XLSX || !window.ExcelJS || !window.SHOP_DATA) throw new Error('组件或店铺表没载入，请重新整理页面');
      var wb = XLSX.read(new Uint8Array(await file.arrayBuffer()), { type: 'array' });
      var sheet = wb.SheetNames[0];
      var aoa = sheet ? XLSX.utils.sheet_to_json(wb.Sheets[sheet], { header: 1, raw: true, defval: '' }) : [];
      if (!aoa.length) throw new Error('文件是空的');
      var p = BJP.parse(aoa);
      if (p.missing.length) throw new Error('第一个工作表「' + sheet + '」找不到这几栏：' + p.missing.join('、'));
      if (!p.rows.length) throw new Error('第一个工作表「' + sheet + '」没有资料');
      var g = BJP.group(p.rows, window.SHOP_DATA);
      state = { file: file.name, sheet: sheet, month: BJP.monthOf(sheet, file.name), rows: p.rows, groups: g.groups, problems: g.problems, warnings: g.warnings, optional: p.optional };
      render();
      window.HQBus && HQBus.emit({ tool: 'bjp', kind: 'processed', files: 1, items: p.rows.length, groups: g.groups.length, problem: g.problems.length });
    } catch (e) {
      state = null;
      $('out').innerHTML = '<div class="error" role="alert">读不出来：' + esc(e.message || e) + '</div>';
    }
  }

  function render() {
    var s = state, qty = s.groups.reduce(function (a, g) { return a + g.qty; }, 0);
    var h = '<section class="card pad facts"><span>文件 <b>' + esc(s.file) + '</b></span><span>工作表 <b>' + esc(s.sheet) + '</b>（第一个）</span>' +
      '<span>共 <b>' + s.rows.length + '</b> 单 · 保健品 <b>' + qty + '</b> 盒 · 分成 <b>' + s.groups.length + '</b> 份</span>' +
      '<label>月份 <input id="month" inputmode="numeric" value="' + esc(s.month) + '" aria-label="文件名的月份"> 月</label>' +
      '<span class="small">店铺表 ' + esc((window.SHOP_DATA && SHOP_DATA.updated) || '') + ' 版</span></section>';
    if (s.problems.length) h += '<section class="warn" role="alert"><b>有 ' + s.problems.length + ' 单分不到督导，没有放进任何文件：</b><ul>' +
      s.problems.map(function (x) { return '<li>第 ' + x.row.line + ' 行 ' + esc(x.row.order || '') + ' ' + esc(x.row.name || '') + '：' + esc(x.why) + '</li>'; }).join('') + '</ul></section>';
    if (s.optional.length) h += '<section class="warn" role="status"><b>找不到这几栏，每份文件的这几栏会是空的：</b>' + esc(s.optional.join('、')) + '</section>';
    if (s.warnings.length) h += '<section class="warn" role="status"><b>有 ' + s.warnings.length + ' 处要核对（订单都已放进文件）：</b><ul>' +
      s.warnings.map(function (x) { return '<li>第 ' + x.row.line + ' 行 ' + esc(x.row.order || '') + ' ' + esc(x.row.name || '') + '：' + esc(x.why) + '</li>'; }).join('') + '</ul></section>';
    h += '<section class="card"><div class="tbl"><table><thead><tr><th scope="col">督导</th><th scope="col">群</th><th scope="col">店铺</th><th scope="col" style="text-align:right">单数</th><th scope="col" style="text-align:right">保健品数量</th><th scope="col">文件名</th><th scope="col"><span class="vh">下载</span></th></tr></thead><tbody>' +
      s.groups.map(function (g, i) {
        return '<tr><td class="grp">' + esc(g.sups[0]) + '</td><td>' + esc(g.label === g.sups[0] ? '—' : g.title) + '</td><td class="num">' + g.shops.length + '</td><td class="num">' + g.rows.length + '</td><td class="num">' + g.qty + '</td>' +
          '<td class="fn">' + esc(BJP.fileName(monthNow(), g.label)) + '</td><td><button type="button" class="btn small" data-dl="' + i + '">下载</button></td></tr>';
      }).join('') + '</tbody></table></div></section>';
    h += '<div class="acts"><span class="small">每份照「8月份保健品发货明细」的格式：一个工作表、置中、细框线；一个督导一份；文件名后面写督导的群和督导名字（没有群就只写督导名字）。</span>' +
      '<button type="button" class="btn g-btn3d" data-zip' + (s.groups.length ? '' : ' disabled') + '>全部打包下载（' + s.groups.length + ' 份）</button></div>';
    $('out').innerHTML = h;
    $('month').addEventListener('input', function () { var v = this.value.replace(/\D/g, '').slice(0, 2), n = parseInt(v, 10); this.value = v; state.month = n >= 1 && n <= 12 ? String(n) : '';
      this.setAttribute('aria-invalid', v && !state.month ? 'true' : 'false');
      document.querySelectorAll('#out td.fn').forEach(function (td, i) { td.textContent = BJP.fileName(monthNow(), state.groups[i].label); }); });
  }
  function monthNow() { return state && state.month ? state.month : ''; }

  function save(blob, name) { var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
  async function bufOf(g) { return BJP.build(ExcelJS, g, monthNow()).xlsx.writeBuffer(); }
  var XLSX_TYPE = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';

  document.addEventListener('click', async function (e) {
    var b = e.target.closest('[data-dl],[data-zip]'); if (!b || !state) return;
    b.disabled = true;
    try {
      if (b.hasAttribute('data-dl')) { var g = state.groups[+b.getAttribute('data-dl')]; save(new Blob([await bufOf(g)], { type: XLSX_TYPE }), BJP.fileName(monthNow(), g.label)); }
      else {
        var zip = new JSZip();
        var names = BJP.uniqueNames(state.groups.map(function (g) { return BJP.fileName(monthNow(), g.label); }));
        for (var i = 0; i < state.groups.length; i++) zip.file(names[i], await bufOf(state.groups[i]));
        save(await zip.generateAsync({ type: 'blob' }), (monthNow() ? monthNow() + '月份' : '') + '保健品发货明细（按督导分）.zip');
      }
    } catch (err) { alert('下载失败：' + (err.message || err)); }
    b.disabled = b.hasAttribute('data-zip') && !state.groups.length;
  });

  $('pick').addEventListener('change', function () { if (this.files[0]) load(this.files[0]); this.value = ''; });
  var drop = $('drop');
  ['dragenter', 'dragover'].forEach(function (t) { window.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (t) { window.addEventListener(t, function (e) { e.preventDefault(); if (t === 'drop' || !e.relatedTarget) drop.classList.remove('over'); }); });
  window.addEventListener('drop', function (e) { var f = e.dataTransfer && e.dataTransfer.files[0]; if (f) load(f); });
})();
</script>
</body>
</html>
