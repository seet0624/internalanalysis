<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>技术单审核台</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Three steps: 上传 → 处理待办 → 下载. Warm white ground, white cards, deep teal accent. */
:root{
  --bg:#F4F3EF; --surface:#FFFFFF; --sunk:#F4F3EF; --ink:#1D2125; --muted:#55544E; --faint:#6B6A64; --line:#E3E1DA; --line-soft:#ECEAE3; --field:#D6D3CA;
  --accent:#0E6B66; --accent-hover:#0B5753; --accent-soft:#E3F0EE; --accent-ink:#0B4F4B; --on-accent:#FFFFFF;
  --crit:#B3261E; --crit-bg:#FBE9E7; --crit-ink:#8C1D18; --warn:#7A4300; --warn-bg:#FFF1DC; --orange:#C26A00;
  --blue:#3A6EA5; --blue-bg:#E8F0F8; --blue-ink:#234D78; --ok:#2C6A37; --ok-bg:#E6F2E8;
  --bar:#1D2125; --bar-ink:#FFFFFF; --bar-warn:#F2B866; --sel:#EEF6F5;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121518; --surface:#1B1F23; --sunk:#151A1D; --ink:#E9EBEC; --muted:#A3A8AD; --faint:#8E949A; --line:#2D3338; --line-soft:#252A2F; --field:#3A4147;
  --accent:#4FB3AC; --accent-hover:#6CC4BD; --accent-soft:#17312F; --accent-ink:#8FD6CF; --on-accent:#0B1615;
  --crit:#FF8A80; --crit-bg:#3A1C1A; --crit-ink:#FFB3AB; --warn:#F2B866; --warn-bg:#33270F; --orange:#F0A64B;
  --blue:#8DB8E8; --blue-bg:#1B2A3A; --blue-ink:#B5D2F2; --ok:#7FCC8C; --ok-bg:#183020;
  --bar:#0B0D10; --bar-ink:#E9EBEC; --bar-warn:#F2B866; --sel:#17312F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121518; --surface:#1B1F23; --sunk:#151A1D; --ink:#E9EBEC; --muted:#A3A8AD; --faint:#8E949A; --line:#2D3338; --line-soft:#252A2F; --field:#3A4147;
  --accent:#4FB3AC; --accent-hover:#6CC4BD; --accent-soft:#17312F; --accent-ink:#8FD6CF; --on-accent:#0B1615;
  --crit:#FF8A80; --crit-bg:#3A1C1A; --crit-ink:#FFB3AB; --warn:#F2B866; --warn-bg:#33270F; --orange:#F0A64B;
  --blue:#8DB8E8; --blue-bg:#1B2A3A; --blue-ink:#B5D2F2; --ok:#7FCC8C; --ok-bg:#183020;
  --bar:#0B0D10; --bar-ink:#E9EBEC; --bar-warn:#F2B866; --sel:#17312F; color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}

/* header + steps */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1360px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px}
@media (min-width:720px){.top-in{padding:14px 24px}}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700}
.steps{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.step{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:var(--faint);font-weight:500}
.step .num{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--faint);display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.step.done{color:var(--accent)}
.step.done .num{border:0;background:var(--accent-soft)}
.step[aria-current="step"]{background:var(--accent);color:var(--on-accent)}
.step[aria-current="step"] .num{border:0;background:var(--on-accent);color:var(--accent);font-weight:700}
.step[disabled]{cursor:default;opacity:.7}
.arrow{color:var(--field)}
.top-r{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.theme svg{flex:none}
.who{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;color:var(--muted);font-size:14px}
.who b{color:var(--ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid var(--field);border-radius:10px;background:var(--surface);color:var(--ink);font-weight:500;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{border-color:var(--accent);background:var(--accent);color:var(--on-accent);font-weight:700}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{color:var(--crit)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:8px}
.btn.link{border:0;background:transparent;color:var(--accent);padding:0 6px;min-height:36px}
.btn[disabled]{opacity:.5;cursor:default}
.btn[aria-pressed="true"].pick-on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn[aria-pressed="true"].pick-red{background:var(--crit);border-color:var(--crit);color:#FFFFFF}
.btn.red-out{border-color:var(--crit);color:var(--crit)}

.page{max-width:1360px;margin:0 auto;padding:24px 16px 120px;display:flex;flex-direction:column;gap:20px}
@media (min-width:720px){.page{padding:28px 24px 120px}}
.narrow{max-width:960px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.pad{padding:20px 22px}
.lead{color:var(--muted);font-size:16px}
.small{font-size:13px;color:var(--muted)}
.error{background:var(--crit-bg);color:var(--crit-ink);border-radius:12px;padding:12px 16px}
.status{display:flex;align-items:center;gap:10px;color:var(--accent-ink);font-weight:500}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* upload */
.hero h1{font-size:30px;font-weight:700}
@media (min-width:720px){.hero h1{font-size:32px}}
.drop{position:relative;border:2px dashed #8FB8B4;border-radius:20px;background:var(--surface);padding:48px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop .ico{width:72px;height:72px;border-radius:20px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.drop .big{font-size:20px;font-weight:700}
.drop .fake{display:inline-flex;align-items:center;min-height:48px;padding:0 28px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:16px}
.loaded{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.loaded ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.loaded li{font-size:13px;padding:2px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);overflow-wrap:anywhere}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lbl{font-size:13px;color:var(--muted)}
.field input,.field textarea{min-height:44px;padding:9px 12px;border:1px solid var(--field);border-radius:10px;background:var(--surface);width:100%}
.field textarea{resize:vertical;font-size:14px}
.ro{min-height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:10px;background:var(--sunk);color:var(--muted)}
details>summary{cursor:pointer;color:var(--accent);font-weight:500;min-height:40px;display:flex;align-items:center;gap:6px;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);margin-right:4px;transition:transform .15s}
details[open]>summary::before{transform:rotate(45deg)}
.adv{border-top:1px solid var(--line-soft);padding-top:8px}
.adv .fgrid{margin-top:8px}
.namefmt{font-size:13px;background:var(--sunk);border-radius:10px;padding:12px 14px;overflow-wrap:anywhere;color:var(--muted)}
ol.rules{margin:8px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:14px}
ol.rules b.red{color:var(--crit)}
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:16px}
.feat{display:flex;gap:12px;align-items:flex-start}
.feat .ic{flex:none;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.feat b{display:block}

/* review */
.progress{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 32px}
.progress .big{font-size:24px;font-weight:700}
.progress .big em{font-style:normal;color:var(--crit)}
.progress .big.done em{color:var(--ok)}
.bar{flex:1 1 260px;max-width:420px;display:flex;flex-direction:column;gap:6px}
.track{height:10px;border-radius:999px;background:var(--line-soft);overflow:hidden}
.track span{display:block;height:100%;background:var(--accent);border-radius:999px}
.cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.filters{flex:1 1 220px;max-width:260px;padding:10px;display:flex;flex-direction:column;gap:2px}
@media (max-width:760px){.filters{max-width:none;flex-direction:row;flex-wrap:wrap}.filters .sep{display:none}.filters .sub{padding-left:12px}}
.flt{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:42px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--ink);text-align:left}
.flt:hover{background:var(--sunk)}
.flt[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.flt .n{color:var(--faint);font-weight:400;font-variant-numeric:tabular-nums}
.flt .n.hot{min-width:26px;padding:0 8px;border-radius:999px;background:var(--crit);color:#FFFFFF;text-align:center;font-size:13px;font-weight:700}
.flt.sub{padding-left:28px;font-size:14px;min-height:38px;color:var(--muted)}
.flt .lab{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.sep{height:1px;background:var(--line-soft);margin:8px 4px}
.main{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:12px}
.main-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.main-h h2{font-size:18px}
.search{display:flex;align-items:center;gap:8px;min-height:42px;padding:0 12px;border:1px solid var(--field);border-radius:10px;background:var(--surface);flex:0 1 260px}
.search input{border:0;outline:0;background:transparent;min-width:0;flex:1}
.todo{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.todo.decided{background:var(--sunk)}
.todo-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.todo-h .nm{font-weight:700;font-size:16px}
.todo-h .meta{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700}
.tag.crit{background:var(--crit-bg);color:var(--crit-ink)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.blue{background:var(--blue-bg);color:var(--blue-ink)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.plain{background:var(--sunk);color:var(--muted);font-weight:500}
.todo .why{color:var(--ink)}
.quote{margin:0;padding:10px 14px;border-radius:10px;background:var(--sunk);color:var(--ink);overflow-wrap:anywhere}
.todo.decided .quote,.todo.decided .copy{background:var(--surface)}
.copy{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--sunk)}
.copy code{flex:1 1 280px;min-width:0;font-family:var(--sans);font-size:14px;overflow-wrap:anywhere;user-select:all}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.decision{font-size:14px;color:var(--ok);font-weight:500}
.alldone{text-align:center;padding:36px 20px;display:flex;flex-direction:column;align-items:center;gap:8px}
.files{display:flex;flex-direction:column;gap:12px}
.file>summary{color:var(--ink);padding:12px 18px;justify-content:flex-start;flex-wrap:wrap;gap:6px 12px;min-height:52px}
.file>summary .t{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;flex:1 1 auto;min-width:0}
.file>summary b{font-size:16px}
.file[open]>summary{border-bottom:1px solid var(--line-soft)}
.tbl{overflow-x:auto;position:relative}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:580px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:13px;padding:8px}
td{padding:10px 8px;border-top:1px solid var(--line-soft);vertical-align:middle}
th:first-child,td:first-child{padding-left:18px}
th:last-child,td:last-child{padding-right:18px;text-align:right}
tr.on td{background:var(--sel)}
.who-cell{display:flex;align-items:center;gap:8px;font-weight:700}
.who-cell small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.sw{width:12px;height:12px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.18);display:inline-block}
.st-crit{color:var(--crit);font-weight:500}.st-orange{color:var(--orange);font-weight:500}.st-blue{color:var(--blue);font-weight:500}.st-ok{color:var(--ok);font-weight:500}
.mini{display:flex;flex-wrap:wrap;gap:4px}
.mini span{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.mini span.hi{background:var(--crit-bg);color:var(--crit-ink)}
.ferr{padding:12px 18px;color:var(--crit)}

/* detail */
.detail{flex:1 1 340px;max-width:440px;display:flex;flex-direction:column;align-self:flex-start;position:sticky;top:12px;max-height:calc(100vh - 110px)}
@media (max-width:1100px){.detail{position:static;max-height:none;max-width:none}}
.detail-h{padding:16px 18px;border-bottom:1px solid var(--line-soft);display:flex;flex-direction:column;gap:6px}
.detail-h .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.detail-h .nm{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;overflow-wrap:anywhere}
.x{width:40px;height:40px;border:0;border-radius:8px;background:transparent;display:flex;align-items:center;justify-content:center;flex:none}
.x:hover{background:var(--sunk)}
.tabs{display:flex;gap:4px;padding:6px 12px 0;border-bottom:1px solid var(--line-soft)}
.tab{min-height:40px;padding:0 12px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted)}
.tab[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--accent);font-weight:700}
.detail-b{padding:6px 18px 12px;overflow-y:auto;min-height:0}
.frow{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:6px 10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.frow>label{grid-column:1;grid-row:1}
.frow>.inp{grid-column:2;grid-row:1}
.frow>.redtog,.frow>.tg{grid-column:3;grid-row:1}
.frow.long{grid-template-columns:minmax(0,1fr) auto}
.frow.long>.redtog,.frow.long>.tg{grid-column:2}
.frow.long>.inp{grid-column:1/-1;grid-row:2}
.frow label{font-size:13px;color:var(--muted);padding-top:8px;overflow-wrap:anywhere}
.frow.edited label{color:var(--crit);font-weight:700}
.frow .inp{width:100%;min-height:38px;padding:7px 10px;border:1px solid var(--field);border-radius:8px;background:var(--surface);font-size:14px;line-height:1.5}
.frow textarea.inp{resize:vertical}
.frow .inp[readonly]{background:var(--sunk);color:var(--muted)}
.frow.isred .inp{color:var(--crit)}
.frow.edited .inp{border-color:var(--crit)}
.redtog{margin-top:4px;min-height:30px;padding:0 10px;border:1px solid var(--field);border-radius:999px;background:var(--surface);color:var(--muted);font-size:12px;white-space:nowrap}
.redtog[aria-pressed="true"]{border-color:var(--crit);color:var(--crit);font-weight:700}
.note{font-size:12px;color:var(--faint)}
.log{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.log li{padding:8px 12px;border-radius:10px;font-size:14px;overflow-wrap:anywhere}
.log li.high{background:var(--crit-bg);color:var(--crit-ink)}
.log li.mid{background:var(--warn-bg);color:var(--warn)}
.log li.info{background:var(--sunk);color:var(--muted)}
.fam{margin-top:12px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;background:var(--sunk);border-radius:10px;padding:10px 12px}
.fam .rel{color:var(--muted)}
.fam .hit{color:var(--crit);font-weight:700}
.detail-f{margin-top:auto;padding:12px 18px;border-top:1px solid var(--line-soft);display:flex;flex-wrap:wrap;gap:8px}
.detail-f .btn{flex:1 1 130px}
.detail-empty{padding:28px 20px;color:var(--muted);text-align:center}

/* bottom bar */
.dock{position:sticky;bottom:0;z-index:20;background:var(--bar);color:var(--bar-ink)}
.dock-in{max-width:1360px;margin:0 auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px}
@media (min-width:720px){.dock-in{padding-inline:24px}}
.dock .sum{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px}
.dock .w{color:var(--bar-warn)}
.bulk{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:12px 18px;background:var(--warn-bg);border-color:transparent;color:var(--warn)}
@media (max-width:600px){.dock .sum span:not(.w){display:none}.dock-in{flex-wrap:nowrap}.dock .btn{min-height:44px}.steps .step{padding:0 10px}}
.dock .btn{background:var(--bar-ink);color:var(--bar);border-color:var(--bar-ink);font-weight:700;min-height:48px}

/* download */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr))}
.fact{padding:18px 22px;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--line-soft)}
@media (min-width:720px){.fact{border-bottom:0;border-right:1px solid var(--line-soft)}.fact:last-child{border-right:0}}
.fact .k{font-size:13px;color:var(--muted)}
.fact .v{font-size:22px;font-weight:700;overflow-wrap:anywhere}
.inline-in{min-height:44px;padding:0 12px;border:1px solid var(--field);border-radius:10px;background:var(--surface);font-size:18px;font-weight:700;width:100%;max-width:200px;min-width:0;flex:1 1 140px}
.warnbox{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:14px 18px;border-radius:14px;background:var(--warn-bg);color:var(--warn)}
.warnbox ul{margin:0;padding-left:20px}
.pkg{padding:18px 22px;display:flex;flex-direction:column;gap:12px}
.pkg.off{opacity:.65}
.pkg-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.pkg-h .t{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px}
.pkg-h b{font-size:17px}
.chk{display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.fname{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 8px 14px;border-radius:10px;background:var(--sunk);overflow-wrap:anywhere}
.fname span{min-width:0;flex:1 1 260px}
.fname.zip{font-weight:700}
.flist{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.go{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:10px}

.rules-box{display:flex;flex-direction:column;gap:14px}
.rules-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.rule-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:12px;align-items:start}
.rule-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.rule-top{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:0;text-align:left;min-height:36px;color:var(--ink)}
.rule-no{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.rule-t{font-weight:700;font-size:16px;flex:1}
.rule-n{font-size:12px;color:var(--faint)}
.rule-list{margin:0;padding:0 0 0 18px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.rule-list b{color:var(--ink)}.rule-list b.r,.r{color:var(--crit)}
.rule-card .btn.link{align-self:flex-start;padding:0;min-height:32px}
.pv{position:fixed;inset:0;z-index:70;background:rgba(10,12,16,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.pv-box{background:var(--surface);border-radius:16px;width:100%;max-width:900px;height:min(92vh,1100px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.pv-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 10px 18px;border-bottom:1px solid var(--line)}
.pv iframe{flex:1;width:100%;border:0;background:#F4F3EF}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2)}
</style>
</head>
<body>


<div class="top"><div class="top-in">
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="7" fill="#0E6B66"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    技术单审核台
  </div>
  <nav class="steps" aria-label="步骤" id="steps"></nav>
  <div class="top-r"><div class="who" id="who"></div>
  <button type="button" class="btn small theme" id="theme" aria-pressed="false"></button></div>
</div></div>

<div id="app"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="review-engine.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var E = window.ReviewEngine;

  // 浅色 by default; 深色 only when chosen here (remembered in this browser)
  var THEME_ICON = {
    dark: '<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',
    light: '<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'
  };
  function applyTheme(mode) {
    document.documentElement.setAttribute('data-theme', mode);
    var b = $('theme');
    b.innerHTML = mode === 'dark' ? THEME_ICON.light + '浅色' : THEME_ICON.dark + '深色';
    b.setAttribute('aria-pressed', mode === 'dark' ? 'true' : 'false');
    b.setAttribute('aria-label', mode === 'dark' ? '切换到浅色' : '切换到深色');
  }
  var savedTheme = 'light';
  try { if (localStorage.getItem('tsr-theme') === 'dark') savedTheme = 'dark'; } catch (e) {}
  applyTheme(savedTheme);
  $('theme').addEventListener('click', function () {
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem('tsr-theme', next); } catch (e) {}
  });
  var state = {
    inputs: [], results: null, problems: {}, edits: {}, reds: {},
    view: 'upload', filter: 'todo', sel: null, tab: 'fields', allFields: false, q: '', openFiles: {},
    pick: { good: true, urgent: true, bad: false }, busy: false, error: '',
    set: { date: E.todayStr(), reviewer: E.DEFAULTS.reviewer, brands: E.DEFAULTS.splitWatchBrands.join('，'), askfirst: E.DEFAULTS.askFirstProducts.join('，'), urgent: E.DEFAULTS.urgentWords.join('，') }
  };
  var downloadsP = window.claude && window.claude.use ? window.claude.use('downloads').catch(function () { return null; }) : Promise.resolve(null);

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function list(s) { return String(s || '').split(/[,，、\s]+/).map(function (x) { return x.trim(); }).filter(Boolean); }

  var toastT;
  function toast(msg) { var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, 3500); }
  function normDate(d) { return String(d || '').trim().replace(/[\-\/]/g, '.').replace(/^0(\d)\./, '$1.').replace(/\.0(\d)\./, '.$1.'); }

  var ICON = {
    up: '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17H6a4 4 0 0 1-.5-7.97A6 6 0 0 1 17.3 7.5 4.5 4.5 0 0 1 18 16.9"/><path d="M12 12v9M8.5 15.5L12 12l3.5 3.5"/></svg>',
    dl: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg>',
    x: '<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    check: '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5l2.5 2.5L10 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    arrow: '<svg class="arrow" width="20" height="12" viewBox="0 0 20 12" aria-hidden="true"><path d="M2 6h15M13 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',

    eye: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    globe: '<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>'
  };

  // ---------- files in / files out ----------
  async function save(filename, data) {
    var dl = await downloadsP;
    if (!dl) {
      // Outside claude.ai (GitHub Pages, a local copy): an ordinary browser download
      try {
        var blob = data instanceof Blob ? data : new Blob([data]);
        var url = URL.createObjectURL(blob), a = document.createElement('a');
        a.href = url; a.download = filename; a.style.display = 'none';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
        toast('已下载：' + filename);
        return true;
      } catch (e) { toast('下载失败：' + (e && e.message || e)); return false; }
    }
    try { await dl.save({ filename: filename, data: data }); toast('已保存：' + filename); return true; }
    catch (e) {
      var code = e && e.code;
      if (code === 'declined') return false;
      if (code === 'rate_limited') toast('已有一个保存窗口开着，请先处理它。');
      else toast('保存失败：' + (e && e.message || code));
      return false;
    }
  }
  function decodeZipEntryName(bytes) {
    try { return new TextDecoder('utf-8', { fatal: true }).decode(bytes); }
    catch (e) { try { return new TextDecoder('gbk').decode(bytes); } catch (e2) { return new TextDecoder('utf-8').decode(bytes); } }
  }
  async function readInputs(files) {
    var out = [];
    state.seen = [];
    for (var i = 0; i < files.length; i++) {
      var f = files[i], buf = await f.arrayBuffer();
      state.seen.push(f.name);
      if (/\.zip$/i.test(f.name)) {
        var zip = await JSZip.loadAsync(buf, { decodeFileName: decodeZipEntryName });
        var names = Object.keys(zip.files).filter(function (n) { return /\.xlsx$/i.test(n) && !/(^|\/)(__MACOSX|~\$)/.test(n); });
        if (!names.length) state.seen.push('（zip 里：' + Object.keys(zip.files).join('、') + '）');
        // H on the zip (海外) carries over to every sheet inside it
        var zipH = E.isOverseasName(f.name);
        for (var j = 0; j < names.length; j++) {
          var en = names[j].split('/').pop();
          out.push({ name: en, overseas: zipH || E.isOverseasName(en), buffer: await zip.files[names[j]].async('arraybuffer') });
        }
      } else if (/\.xlsx$/i.test(f.name)) out.push({ name: f.name, buffer: buf });
    }
    return out;
  }

  async function run() {
    if (!state.inputs.length) {
      state.error = '没有找到 .xlsx 技术单。' + (state.seen && state.seen.length ? '收到的文件：' + state.seen.join('、') + '。请上传 .xlsx 或装着 .xlsx 的 .zip（旧版 .xls 请先在 Excel 另存为 .xlsx）。' : '');
      render(); return false;
    }
    var date = normDate(state.set.date);
    if (!/^\d{1,2}\.\d{1,2}\.\d{4}$/.test(date)) { state.error = '日期请写成 日.月.年，例如 ' + E.todayStr() + '。'; state.view = 'upload'; render(); return false; }
    state.error = ''; state.busy = true; render();
    try {
      state.date = date;
      state.reviewer = state.set.reviewer.trim() || 'martin';
      state.results = await E.processFiles(state.inputs, { problems: state.problems, edits: state.edits, reds: state.reds, askFirstProducts: list(state.set.askfirst), date: date, reviewer: state.reviewer, splitWatchBrands: list(state.set.brands), urgentWords: list(state.set.urgent) });
    } catch (e) { state.error = '审核失败：' + (e && e.message || e); }
    state.busy = false;
    render();
    return !state.error;
  }
  async function addFiles(fl) {
    try {
      var got = await readInputs(Array.prototype.slice.call(fl || []));
      var by = {};
      state.inputs.concat(got).forEach(function (f) { by[f.name] = f; });
      state.inputs = Object.keys(by).map(function (k) { return by[k]; });
      if (await run()) { state.view = 'review'; state.filter = 'todo'; render(); window.scrollTo(0, 0); }
    } catch (e) { state.error = '读取文件失败：' + (e && e.message || e); state.busy = false; render(); }
  }

  // ---------- derived data ----------
  function allOutputs() {
    var o = [];
    (state.results || []).forEach(function (r) { r.outputs.forEach(function (x) { o.push(x); }); });
    return o;
  }
  function orderTotal(outs) { return outs.reduce(function (n, o) { return n + o.orders; }, 0); }
  // the zip carries H only when every file in it is 海外
  function outZipName(problem, n, outs) {
    var h = outs && outs.length && outs.every(function (o) { return o.overseas; });
    return (problem ? '有问题技术单 ' : '技术单 ') + state.date + '（' + n + '）' + (h ? 'H' : '') + '.zip';
  }
  function regionOf(outs) {
    if (!outs.length) return '—';
    var h = outs.filter(function (o) { return o.overseas; }).length;
    return h === outs.length ? '海外（有 H）' : h === 0 ? '国内（没有 H）' : '国内 ' + (outs.length - h) + ' 个 + 海外 ' + h + ' 个';
  }
  function items() {
    var out = [];
    (state.results || []).forEach(function (r, ri) { r.orders.forEach(function (o, oi) { out.push({ r: r, o: o, ri: ri, oi: oi, mk: r.name + '|' + o.key }); }); });
    return out;
  }
  function findItem(mk) { return items().filter(function (it) { return it.mk === mk; })[0] || null; }
  function famOf(o) { return o.flags.filter(function (f) { return f.group; })[0] || null; }
  function statusOf(o) {
    return o.problem ? { t: '有问题', c: 'crit', d: 'var(--crit)' } : o.urgent ? { t: '特殊加急', c: 'orange', d: 'var(--orange)' } : o.newborn ? { t: '新生儿', c: 'blue', d: 'var(--blue)' } : { t: '没问题', c: 'ok', d: 'var(--ok)' };
  }
  var PROB_LABEL = { product: '先问能不能做', exchange: '换购要原单号', ask: '要问下单者', zodiac: '要问下单者', 'engrave-no': '刻名字要确认' };
  var OK_LABEL = { product: '可以做，放回普通文件', exchange: '已有原单号，放回普通文件', ask: '已问过，没问题', zodiac: '已问过，没问题', 'engrave-no': '已确认，放回普通文件' };
  // Things only the reviewer can decide: orders the rules sent to 有问题, and 备注 that may or may not turn red.
  function todos() {
    var out = [];
    items().forEach(function (it) {
      var pf = it.o.flags.filter(function (f) { return f.problem; });
      if (it.o.autoProblem && pf.length) {
        var k = pf[0].kind;
        out.push({ type: 'problem', kind: k, label: PROB_LABEL[k] || '要确认', it: it, flags: pf, decided: has(state.problems, it.mk), ok: has(state.problems, it.mk) && !state.problems[it.mk] });
      }

    return out;
  }
  var SHORT = { 'engrave-no': '刻名字是单号', zishi: '子时', urgent: '加急', engrave: '刻名字空', family: '家人姓名', name: '人名', zodiac: '生肖', ask: '要问人', newborn: '新生儿', product: '先问能不能做', exchange: '换购没原单号', keepname: '保留字', namewish: '起名要求', orderno: '订单号', trad: '繁体', twin: '双胞胎', status: '状态备注', dup: '总备注已清空', birthnote: '出生时间', oldname: '曾用名', date: '日期', pending: '备注待定', 'surname-change': '换姓', 'surname-variant': '简繁姓', 'surname-rz': '认祖归宗', edited: '已修改', 'status-urgent': '状态备注写加急', selfname: '本人名字', 'zishi-note': '子时？' };
  var ATTENTION = { engrave: 1, name: 1, family: 1, namewish: 1, keepname: 1, 'status-urgent': 1, zishi: 1, 'surname-rz': 1, twin: 1 };
  var FILTERS = [
    { k: 'all', t: '全部订单', test: function () { return true; } },
    { k: 'problem', t: '有问题', dot: 'var(--crit)', test: function (o) { return o.problem; } },
    { k: 'urgent', t: '特殊加急', dot: 'var(--orange)', test: function (o) { return o.urgent && !o.problem; } },
    { k: 'newborn', t: '新生儿', dot: 'var(--blue)', test: function (o) { return o.newborn && !o.problem; } },
    { k: 'family', t: '家人订单', fam: true, test: function (o) { return !!famOf(o); } },
    { k: 'attention', t: '要留意', dot: 'var(--warn)', test: function (o) { return o.flags.some(function (f) { return ATTENTION[f.kind] && f.level === 'high' || f.kind === 'zishi'; }); } },
    { k: 'ok', t: '没问题', dot: 'var(--ok)', test: function (o) { return !o.problem && !o.urgent && !o.newborn; } }
  ];
  function matchesQ(it) {
    var q = state.q.trim();
    return !q || (it.o.person + ' ' + it.o.key + ' ' + it.r.tool).indexOf(q) >= 0;
  }

  // ---------- 审核规则手册: one source for the cards on the page, the preview and the downloaded file ----------
  // [[…]] = red keyword, {{…}} = bold
  var RULE_SECTIONS = [
    { id: 'red', t: '标红原则', c: '#B3261E', bg: '#FBE9E7', items: [
      '只改{{字体颜色}}，不动位置、大小、合并格；红色一律是[[红字]]，不涂底色',
      '原文件里涂了底色的格子，一律改成[[红字]]',

    ] },
    { id: 'remark', t: '备注 / 总备注', c: '#B3261E', bg: '#FBE9E7', items: [
      '有[[人名]]：家人姓名、学员本人（只写名也算，例如「宛蓉」）、这次上传里其他学员、「姓名：…」「小名叫…」「…的名字」、复姓（欧阳…）',
      '有[[曾用名 / 原名 / 原来的名字 / 后来改名]]',
      '有[[别的订单号]]（原订单号、家人的单）',
      '写了[[出生时间]]（例如 出生时间：0300am）— 和出生时间栏核对',
      '有[[起名要求]]（少笔画、同音、好写、不要用某个字）或要求[[保留某个字]]',
      '提到[[简体 / 繁体]]（名册展示），或总备注说到[[名字]]',
      '有[[日期]]：一个月内当{{特殊加急}}；超过一个月只红字',
      '有[[加急 / 急 / 快点]]（「效果快」「赶快好起来」这类祝福不算）→ 特殊加急',
      '{{订单状态备注}}有内容 → [[红字]]',
      '总备注和备注{{一字不差}} → 清空总备注',
      '名册展示繁体或子时的单，备注只写祝福语 → {{由你选}}要不要标红（可一起选）'
    ] },
    { id: 'naming', t: '名正言顺', c: '#0E6B66', bg: '#E3F0EE', items: [
      '每位学员{{两行}}一样的，只有一行会自动补一行',
      '名册展示[[繁体]] → 红字',
      '[[双胞胎 / 三胞胎]] → 红字；老大父亲生日也红，老二母亲生日也红，老三父母生日都红',
      '新名字姓氏和使用人姓名的姓{{一样不红}}；[[简繁体不同]]或[[学员更换姓氏]] → 红字',
      '姓氏和父亲不同：备注有{{认祖归宗}} → 红字给专家；没有 → {{问下单者}}',
      '父亲名字和母亲名字一样 → [[红字]]，问下单者',
      '[[生肖]]按立春核对（2 月 4 日前算前一年；当天看出生时间；不详算当年），对不上 → 先问下单者，再问督导',
      '使用人姓名写[[新生儿]]（还没有名字）→ 红字；已经有名字就不红'
    ] },
    { id: 'zishi', t: '子时', c: '#7A4300', bg: '#FFF1DC', items: [
      '{{前子时}} 23:00–23:59：公历生日要加一天',
      '{{后子时}} 00:00–00:59：不用加一天',
      '「是否子时」写是 → 时间栏[[红字]]；备注写了子时 / 加一天才红',
      '时间是子时却写「否」，或写「是」但时间不是子时 → {{问下单者}}'
    ] },
    { id: 'product', t: '手表与其他产品', c: '#234D78', bg: '#E8F0F8', items: [
      '一个表里有几种产品（例如天祥、天富、鸿运手表）→ 每种产品{{各开一个文件}}',
      '只有{{天威、天富手表}}分男款、女款文件',
      '刻名字为空 → 提醒查新名字是否下来',
      '刻名字写的是[[订单号]] → 有问题，话术：订单编号 学员 商品，刻名字：…，这个要和服务中心确认',
      '海外单有{{天解手表、天泽手表、福运戒指、天恒手表}} → 先问能不能做，当有问题',
      '{{换购}}单：原订单编号有填就没问题，空的 → 有问题，和服务中心确认',
      '套餐 / 赠品（例如 健康套餐-赠品（名正言顺命名））→ 文件名用括号里的工具名'

    if (e.key === 'Escape' && e.target && e.target.id === 'dl-rev') { state.editRev = false; state.set.reviewer = state.reviewer; render(); }
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.set) state.set[t.dataset.set] = t.value;
    if (t.dataset && 'q' in t.dataset) {
      state.q = t.value; var pos = t.selectionStart; render();
      var nq = document.querySelector('[data-q]'); if (nq) { nq.focus(); try { nq.setSelectionRange(pos, pos); } catch (x) {} }
    }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'pick') { addFiles(t.files); t.value = ''; return; }
    if (t.dataset && t.dataset.pick) { state.pick[t.dataset.pick] = t.checked; render(); }
  });
  // <details> remember open / closed across re-renders
  document.addEventListener('toggle', function (e) {
    var t = e.target;
    if (!t.dataset) return;
    if (t.dataset.file != null) state.openFiles[t.dataset.file] = t.open;
    if ('adv' in t.dataset) state.advOpen = t.open;
    if ('dec' in t.dataset) state.decOpen = t.open;
  }, true);
  document.addEventListener('dragover', function (e) { var dz = e.target.closest && e.target.closest('#drop'); if (dz) { e.preventDefault(); dz.classList.add('over'); } });
  document.addEventListener('dragleave', function (e) { var dz = e.target.closest && e.target.closest('#drop'); if (dz) dz.classList.remove('over'); });
  document.addEventListener('drop', function (e) {
    var dz = e.target.closest && e.target.closest('#drop');
    if (!dz) return;
    e.preventDefault(); dz.classList.remove('over'); addFiles(e.dataTransfer && e.dataTransfer.files);
  });

  render();
})();
</script>

</body>
</html>
