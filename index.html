<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>审核系统</title>
<style>
/* 首页：列出所有审核功能。颜色跟技术单审核台同一套（暖白底、深青色） */
:root{
  --bg:#F4F3EF; --surface:#FFFFFF; --ink:#1D2125; --muted:#55544E; --faint:#6B6A64; --line:#E3E1DA; --field:#D6D3CA;
  --accent:#0E6B66; --accent-soft:#E3F0EE; --accent-ink:#0B4F4B; --on-accent:#FFFFFF;
  --sans:'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121518; --surface:#1B1F23; --ink:#E9EBEC; --muted:#A3A8AD; --faint:#8E949A; --line:#2D3338; --field:#3A4147;
  --accent:#4FB3AC; --accent-soft:#17312F; --accent-ink:#8FD6CF; --on-accent:#0B1615; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121518; --surface:#1B1F23; --ink:#E9EBEC; --muted:#A3A8AD; --faint:#8E949A; --line:#2D3338; --field:#3A4147;
  --accent:#4FB3AC; --accent-soft:#17312F; --accent-ink:#8FD6CF; --on-accent:#0B1615; color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}

.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700}
@media (min-width:720px){.top-in{padding:14px 24px}}

main{max-width:1040px;margin:0 auto;padding:32px 16px 56px}
@media (min-width:720px){main{padding:48px 24px 72px}}
.hero{display:flex;flex-direction:column;gap:8px;margin-bottom:28px}
.hero h1{font-size:28px}
.hero p{color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:12px;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
a.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .head{display:flex;align-items:center;gap:12px}
.card .mark{width:40px;height:40px;flex:none;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;font-family:'Songti SC','SimSun',serif}
.card h2{font-size:18px}
.card .desc{color:var(--muted);font-size:14px}
.card ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.card .go{margin-top:auto;display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:500}
.card.soon{border-style:dashed;background:transparent}
.card.soon .mark{background:transparent;border:1.5px dashed var(--field);color:var(--faint)}

.note{margin-top:28px;display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--faint);font-size:13px}
</style>
</head>
<body>

<div class="top"><div class="top-in">
  <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="7" fill="#0E6B66"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  审核系统
</div></div>

<main>
  <div class="hero">
    <h1>今天要审核什么？</h1>
    <p>选一个功能开始。所有处理都在你的浏览器里完成，文件不会上传到任何服务器。</p>
  </div>
  <div class="grid" id="grid"></div>
  <div class="note"><span>国内网络可直接打开：字体用电脑自带的，Excel / zip 组件放在本站，不依赖外网</span></div>
</main>

<script>
// 审核功能清单。以后加新功能：新建一个文件夹（例如 contract/index.html），再在这里加一项。
var MODULES = [
  {
    href: 'name/',
    mark: '名',
    title: '名字审核',
    desc: '名正言顺名册：逐位学员核对新名，判定没问题 / 有问题。',
    points: ['上传名册 .xlsx', '新名和家人撞字、撞音，连姓念的不雅谐音', '新名自动转繁体，下载三份结果文件']
  },
  {
    href: 'tech/',
    mark: '技',
    title: '技术单审核',
    desc: '按审核规则自动标红、分文件、改页脚，然后下载转发给专家。',
    points: ['上传多个 .xlsx 或整包 .zip', '处理待办：要问下单者、先问能不能做', '分普通 / 加急 / 有问题 / 新生儿下载']
  }
];

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

document.getElementById('grid').innerHTML = MODULES.map(function(m){
  return '<a class="card" href="' + esc(m.href) + '">' +
    '<div class="head"><div class="mark" aria-hidden="true">' + esc(m.mark) + '</div><h2>' + esc(m.title) + '</h2></div>' +
    '<p class="desc">' + esc(m.desc) + '</p>' +
    (m.points && m.points.length ? '<ul>' + m.points.map(function(p){ return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>' : '') +
    '<span class="go">进入 <span aria-hidden="true">→</span></span></a>';
}).join('') +
  '<div class="card soon"><div class="head"><div class="mark" aria-hidden="true">＋</div><h2>更多功能</h2></div>' +
  '<p class="desc">之后会陆续加入其他审核功能。</p></div>';
</script>
</body>
</html>
