  <style>/* ============================================================
   SHUYI · NUMERA — Maison stylesheet
   Cream + ink + soft gold. Italiana display, Cormorant serif body,
   Noto Serif SC for Chinese display.
   ============================================================ */

:root {
  --ink: #1a1614;
  --ink-soft: #3a3431;
  --ink-mute: #6b605a;
  --cream: #f4ecdc;
  --cream-bright: #f9f3e6;
  --cream-deep: #e7dbc1;
  --paper: #fbf6ea;
  --gold: #a98a52;
  --gold-soft: #c5a872;
  --gold-deep: #7a6233;
  --hairline: rgba(26, 22, 20, 0.14);
  --hairline-strong: rgba(26, 22, 20, 0.28);

  --f-display: 'Italiana', 'Noto Serif SC', serif;
  --f-serif: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif;
  --f-zh: 'Noto Serif SC', 'Source Han Serif', serif;
  --f-sans: 'Inter', 'Noto Sans SC', -apple-system, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--cream); color: var(--ink); }
html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body {
  font-family: var(--f-serif);
  font-size: 17px;
  line-height: 1.55;
  letter-spacing: 0.005em;
  background:
    radial-gradient(circle at 18% 8%, rgba(255, 252, 240, 0.6), transparent 50%),
    radial-gradient(circle at 88% 92%, rgba(231, 219, 193, 0.7), transparent 55%),
    var(--cream);
  min-height: 100vh;
}
:lang(zh-CN) body { font-family: var(--f-zh); }

a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

::selection { background: var(--gold); color: var(--paper); }

/* ============================================================
   HEADER
   ============================================================ */
.site-header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  background: rgba(244, 236, 220, 0.55);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  border-bottom: 1px solid transparent;
  transition: background 420ms ease, border-color 420ms ease, box-shadow 420ms ease, backdrop-filter 420ms ease;
}
.site-header-spacer { flex: none; }
.site-header.is-condensed {
  background: rgba(248, 242, 230, 0.88);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom-color: var(--hairline);
  box-shadow: 0 12px 34px -26px rgba(60, 45, 25, 0.55);
}
/* Two-tier head: utility strip · wordmark · nav — collapsing to one line on scroll */
.header-bar {
  max-width: 1440px;
  margin: 0 auto;
  padding: 0 56px;
  display: grid;
  grid-template-columns: 1fr max-content 1fr;
  grid-template-areas: "util util util" "wm wm wm" "nav nav nav";
  align-items: center;
  column-gap: 32px;
  transition: padding 420ms cubic-bezier(0.2, 0.7, 0.2, 1);
}
.header-util { grid-area: util; justify-self: stretch; display: flex; justify-content: flex-end; align-items: center; gap: 26px; margin: 0 -56px; padding: 10px 56px; border-bottom: 1px solid var(--hairline); transition: padding 420ms cubic-bezier(0.2, 0.7, 0.2, 1), gap 300ms ease; }
.wordmark { grid-area: wm; justify-self: center; padding: 26px 0 0; }
.header-nav { grid-area: nav; justify-self: center; padding: 22px 0 18px; }
.site-header.is-condensed .header-bar { grid-template-areas: "nav wm util"; padding: 13px 56px; }
.site-header.is-condensed .header-util { justify-self: end; margin: 0; padding: 0; gap: 16px; border-bottom: 0; }
.site-header.is-condensed .header-util-lbl, .site-header.is-condensed .header-cat-btn { display: none; }
.site-header.is-condensed .wordmark { padding: 0; }
.site-header.is-condensed .header-nav { justify-self: start; padding: 0; }
.header-link { font-family: var(--f-sans); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-soft); display: inline-flex; gap: 14px; align-items: center; }
.header-search-btn, .header-cat-btn, .header-fav-btn { display: inline-flex; align-items: center; gap: 9px; color: var(--ink-soft); white-space: nowrap; transition: color 200ms; position: relative; }
.header-search-btn:hover, .header-cat-btn:hover, .header-fav-btn:hover { color: var(--gold-deep); }
.header-search-btn:focus-visible, .header-cat-btn:focus-visible, .header-fav-btn:focus-visible { outline: 1px solid var(--gold); outline-offset: 4px; }
.header-util-lbl { font-family: var(--f-sans); font-size: 9.5px; letter-spacing: 0.3em; text-transform: uppercase; }
.header-search-btn { width: clamp(200px, 17vw, 280px); height: 36px; padding: 0 8px 0 12px; border: 1px solid var(--hairline-strong); background: rgba(251,246,234,.72); cursor: text; transition: border-color 200ms, background 200ms, color 200ms; }
.header-search-btn:hover { border-color: var(--gold-soft); background: var(--paper); }
.header-search-ph { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; text-align: left; font-family: var(--f-serif); font-size: 14px; letter-spacing: .02em; text-transform: none; color: #8a7e74; }
:lang(zh-CN) .header-search-ph, :lang(zh-TW) .header-search-ph { font-family: var(--f-zh); font-size: 12.5px; letter-spacing: .1em; font-weight: 300; }
.header-search-btn .header-search-kbd { margin-left: auto; }
.hh-link { display: inline-flex; align-items: center; flex: none; }
.header-nav .hh, .header-link .hh { border-bottom: 1px solid transparent; padding-bottom: 2px; white-space: nowrap; transition: border-color 200ms; }
.header-nav .hh:hover, .header-link .hh:hover { border-color: var(--gold); }

.wordmark { text-align: center; line-height: 1; position: relative; min-width: max-content; }
.wordmark-mark, .wordmark-sub { white-space: nowrap; }
.wordmark-mark {
  display: block;
  font-family: var(--f-display);
  font-size: 32px;
  letter-spacing: 0.4em;
  padding-left: 0.4em; /* compensate trailing tracking */
  color: var(--ink);
  position: relative;
  transition: font-size 420ms cubic-bezier(0.2, 0.7, 0.2, 1), letter-spacing 420ms ease;
}
.wordmark-mark span {
  display: inline-block;
  opacity: 0;
  transform: translateY(14px);
  background: linear-gradient(105deg, var(--ink) 0%, var(--ink) 36%, #b8954f 46%, #fff0c8 50%, #b8954f 54%, var(--ink) 64%, var(--ink) 100%);
  background-size: 320% 100%;
  background-position: 120% 0;
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  animation: wordmark-letter 700ms cubic-bezier(0.2, 0.7, 0.2, 1) forwards,
             wordmark-foil 9s ease-in-out 2.4s infinite;
}
.wordmark-mark span:nth-child(1) { animation-delay: 0.15s, 2.4s; }
.wordmark-mark span:nth-child(2) { animation-delay: 0.24s, 2.5s; }
.wordmark-mark span:nth-child(3) { animation-delay: 0.33s, 2.6s; }
.wordmark-mark span:nth-child(4) { animation-delay: 0.42s, 2.7s; }
.wordmark-mark span:nth-child(5) { animation-delay: 0.51s, 2.8s; }
@keyframes wordmark-letter { to { opacity: 1; transform: none; } }
@keyframes wordmark-foil { 0%, 72% { background-position: 120% 0; } 86%, 100% { background-position: -40% 0; } }
.site-header.is-condensed .wordmark-mark { font-size: 19px; letter-spacing: 0.32em; padding-left: 0.32em; }
.wordmark-sub {
  display: block;
  margin-top: 8px;
  font-family: var(--f-sans);
  font-size: 9.5px;
  letter-spacing: 0.42em;
  color: var(--gold);
  text-transform: uppercase;
  padding-left: 0.42em;
  max-height: 20px;
  opacity: 0;
  overflow: hidden;
  animation: wordmark-sub-in 1000ms 0.7s forwards;
  transition: max-height 420ms ease, opacity 320ms ease, margin-top 420ms ease;
}
@keyframes wordmark-sub-in { to { opacity: 1; } }
.site-header.is-condensed .wordmark-sub { max-height: 0; opacity: 0; margin-top: 0; }
/* gold seam draws from centre when condensed */
.wordmark-seam {
  position: absolute; left: 50%; bottom: -14px; width: 0; height: 1px; transform: translateX(-50%);
  background: linear-gradient(to right, transparent, var(--gold), transparent);
  transition: width 600ms cubic-bezier(0.2, 0.7, 0.2, 1);
}
.site-header.is-condensed .wordmark-seam { width: 120%; }

/* magnetic nav indicator */
.header-nav { position: relative; display: inline-flex; gap: 46px; align-items: center; font-family: var(--f-sans); font-size: 11.5px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--ink-soft); }
.site-header.is-condensed .header-nav { gap: 28px; font-size: 11px; letter-spacing: 0.2em; }
.header-nav .hh-link { padding-bottom: 8px; }
.header-nav .hh-link.is-current .hh { color: var(--gold-deep); }

.header-nav-ind {
  position: absolute; bottom: 0; left: 0; width: 0; height: 0; pointer-events: none;
  transition: left 400ms cubic-bezier(0.2, 0.7, 0.2, 1), width 400ms cubic-bezier(0.2, 0.7, 0.2, 1);
}
.header-nav-ind::before {
  content: ''; position: absolute; left: 0; right: 0; bottom: 1px; height: 1px;
  background: linear-gradient(to right, transparent, var(--gold), transparent);
}
.header-nav-ind::after {
  content: ''; position: absolute; left: 50%; bottom: -1px; transform: translateX(-50%);
  width: 5px; height: 5px; border-radius: 50%; background: var(--gold);
  box-shadow: 0 0 8px rgba(231, 201, 138, 0.8);
}
@media (prefers-reduced-motion: reduce) {
  .wordmark-mark { animation: none; background-position: 120% 0; }
  .wordmark-mark span { animation: none; opacity: 1; transform: none; }
  .wordmark-sub { animation: none; opacity: 1; }
}

.lang-toggle {
  font-family: var(--f-sans);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-mute);
  padding: 4px 6px;
  transition: color 180ms;
}
.lang-toggle.on { color: var(--ink); }
.lang-toggle:hover { color: var(--gold); }
.lang-divider { color: var(--hairline-strong); }

/* ── Language dropdown ─────────────────────────────────────── */
.lang-dropdown {
  position: relative;
}
.lang-dropdown-trigger {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  background: none;
  border: 1px solid var(--hairline-strong);
  color: var(--ink);
  font-family: var(--f-sans);
  font-size: 11px;
  letter-spacing: 0.16em;
  cursor: pointer;
  transition: border-color 200ms, color 200ms;
}
.lang-dropdown-trigger:hover {
  border-color: var(--gold);
  color: var(--gold);
}
.lang-dropdown-trigger .lang-dd-native {
  font-family: var(--f-zh);
  font-weight: 400;
  letter-spacing: 0.08em;
}
.lang-dd-globe { color: var(--gold-deep); flex: none; }
.lang-dd-caret { transition: transform 220ms ease; }
.lang-dropdown.is-open .lang-dd-caret { transform: rotate(180deg); }
.lang-dropdown-menu {
  position: absolute;
  top: calc(100% + 10px);
  right: 0;
  min-width: 248px;
  margin: 0; padding: 6px;
  list-style: none;
  background: var(--paper);
  border: 1px solid var(--gold-soft);
  box-shadow:
    0 0 0 1px rgba(231, 201, 138, 0.18) inset,
    0 30px 60px -24px rgba(60, 45, 25, 0.5);
  z-index: 30;
  animation: lang-dd-rise 240ms cubic-bezier(0.2, 0.7, 0.2, 1);
}
.lang-dropdown-menu::before {
  content: '';
  position: absolute; top: -7px; right: 30px;
  width: 12px; height: 12px;
  background: var(--paper);
  border-left: 1px solid var(--gold-soft);
  border-top: 1px solid var(--gold-soft);
  transform: rotate(45deg);
}
@keyframes lang-dd-rise {
  from { opacity: 0; transform: translateY(-8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.lang-dropdown-menu li { margin: 0; padding: 0; }
.lang-dd-head {
  font-family: var(--f-sans);
  font-size: 9.5px; letter-spacing: 0.34em; text-transform: uppercase;
  color: var(--ink-mute);
  padding: 12px 14px 8px;
}
.lang-dd-option {
  width: 100%;
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 12px;
  background: none;
  border: 0;
  padding: 13px 14px;
  cursor: pointer;
  color: var(--ink);
  transition: background 180ms, color 180ms;
  text-align: left;
}
.lang-dd-option:hover {
  background: rgba(231, 201, 138, 0.14);
}
.lang-dd-option .lang-dd-native {
  font-family: var(--f-zh);
  font-weight: 400;
  font-size: 17px;
  letter-spacing: 0.05em;
}
.lang-dd-option .lang-dd-label {
  font-family: var(--f-sans);
  font-size: 9px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-left: auto;
}
.lang-dd-check { color: transparent; flex: none; transition: color 180ms; }
.lang-dd-option.is-active {
  background: rgba(231, 201, 138, 0.16);
}
.lang-dd-option.is-active .lang-dd-check { color: var(--gold-deep); }

/* ============================================================
   PAGE SHELL
   ============================================================ */
.page-shell { min-height: calc(100vh - 200px); }

/* ============================================================
   HOME — Hero
   ============================================================ */
.hero {
  display: grid;
  grid-template-columns: 1.05fr 1fr;
  gap: 80px;
  align-items: center;
  padding: 100px 56px 130px;
  max-width: 1440px;
  margin: 0 auto;
}
.hero-eyebrow {
  font-family: var(--f-sans);
  font-size: 11px;
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 38px;
}
.hero-title { margin: 0 0 38px; line-height: 1; }
.hero-title-en {
  display: block;
  font-family: var(--f-display);
  font-size: 84px;
  font-weight: 400;
  letter-spacing: -0.005em;
  color: var(--ink);
  margin-bottom: 16px;
}
.hero-title-zh {
  display: block;
  font-family: var(--f-zh);
  font-weight: 300;
  font-size: 36px;
  letter-spacing: 0.35em;
  color: var(--ink-soft);
  padding-left: 0.35em;
}
.hero-prose {
  max-width: 460px;
  font-size: 18px;
  line-height: 1.65;
  color: var(--ink-soft);
  margin: 0 0 56px;
}
.hero-actions { font-family: var(--f-sans); font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink); display: inline-flex; gap: 18px; align-items: center; }
.link-underline { border-bottom: 1px solid var(--ink); padding-bottom: 4px; transition: color 200ms, border-color 200ms; }
.link-underline:hover { color: var(--gold); border-color: var(--gold); }
.link-divider { color: var(--hairline-strong); }

.hero-frame {
  aspect-ratio: 1;
  background: var(--paper);
  border: 1px solid var(--hairline);
  position: relative;
  box-shadow:
    0 1px 0 rgba(255, 255, 255, 0.6) inset,
    0 60px 80px -50px rgba(60, 45, 25, 0.35);
}
.hero-frame::before, .hero-frame::after {
  content: ''; position: absolute; pointer-events: none;
  border: 1px solid var(--gold-soft);
  opacity: 0.6;
}
.hero-frame::before { inset: 18px; }
.hero-frame::after { inset: 22px; border-color: var(--hairline); }

/* ============================================================
   HOME — Philosophy
   ============================================================ */
.philosophy {
  max-width: 1440px;
  margin: 0 auto;
  padding: 0 56px 140px;
}
.ph-rule {
  height: 1px;

}

}

}

/* ============================================================
   HOME — Categories list
   ============================================================ */
.categories-home {
  max-width: 1440px;
  margin: 0 auto;
  padding: 0 56px 140px;
}
.section-title { text-align: center; margin: 0 0 70px; line-height: 1.1; }
.section-title-en {
  display: block;
  font-family: var(--f-display);
  font-size: 52px;
  font-weight: 400;
  letter-spacing: 0;

}
.section-title-zh {
  display: block;
  font-family: var(--f-zh);
  font-size: 18px;

.cat-list {

}
.cat-row {

}
.cat-row:hover { background: var(--paper); padding-left: 24px; }
.cat-row-num {
  font-family: var(--f-sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  color: var(--gold);
}
.cat-row-title {
  font-family: var(--f-display);
  font-size: 38px;
  font-weight: 400;
  letter-spacing: 0;
  margin-bottom: 4px;
}
:lang(zh-CN) .cat-row-title { font-family: var(--f-zh); font-weight: 300; font-size: 30px; letter-spacing: 0.06em; }
.cat-row-sub {
  font-family: var(--f-serif);
  font-style: italic;
  color: var(--ink-mute);
  font-size: 17px;
}
:lang(zh-CN) .cat-row-sub { font-style: normal; font-family: var(--f-zh); font-size: 14px; letter-spacing: 0.1em; }
.cat-row-meta {
  display: flex;
  align-items: center;
  gap: 28px;
  font-family: var(--f-sans);
  font-size: 11px;
  letter-spacing: 0.18em;
  color: var(--ink-mute);
  text-transform: uppercase;
}
.cat-row-arrow {
  font-size: 20px;
  color: var(--ink-mute);
  transition: color 220ms, transform 240ms;
}
.cat-row:hover .cat-row-arrow { color: var(--gold); transform: translateX(8px); }

/* ============================================================
   INDEX page
   ============================================================ */
.index-page {
  max-width: 1100px;
  margin: 0 auto;
  padding: 90px 56px 130px;
}
.index-eyebrow {
  font-family: var(--f-sans);
  font-size: 11px;
  letter-spacing: 0.32em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 28px;
  text-align: center;
}
.index-title {
  text-align: center;
  font-family: var(--f-display);
  font-size: 64px;
  font-weight: 400;
  margin: 0 0 100px;
  letter-spacing: 0;
}
:lang(zh-CN) .index-title { font-family: var(--f-zh); font-weight: 300; letter-spacing: 0.2em; padding-left: 0.2em; font-size: 48px; }
.index-section { margin-bottom: 70px; }
.index-section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  border-bottom: 1px solid var(--gold-soft);
  padding-bottom: 12px;
  margin-bottom: 18px;
}
.index-section-head h2 {
  font-family: var(--f-display);
  font-size: 30px;
  font-weight: 400;
  margin: 0;
  letter-spacing: 0;
}
:lang(zh-CN) .index-section-head h2 { font-family: var(--f-zh); font-weight: 300; font-size: 24px; letter-spacing: 0.12em; }
.index-section-head h2 a { transition: color 180ms; }
.index-section-head h2 a:hover { color: var(--gold); }
.index-section-count {
  font-family: var(--f-sans);
  font-size: 12px;
  color: var(--ink-mute);
  letter-spacing: 0.2em;
}
.index-list { list-style: none; margin: 0; padding: 0; }
.index-list li { border-bottom: 1px dashed var(--hairline); }
.index-list a {
  display: flex; align-items: baseline; gap: 16px;
  padding: 14px 4px;
  transition: padding-left 200ms, color 200ms;
}
.index-list a:hover { padding-left: 14px; color: var(--gold-deep); }
.index-list-name {
  font-family: var(--f-serif);
  font-size: 19px;
  white-space: nowrap;
}
:lang(zh-CN) .index-list-name { font-family: var(--f-zh); font-size: 17px; }
.index-list-dots { flex: 1; border-bottom: 1px dotted var(--hairline-strong); position: relative; top: -5px; }
.index-list-extra {
  font-family: var(--f-sans);
  font-size: 11px;
  color: var(--ink-mute);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  white-space: nowrap;
}

/* ============================================================
   CATEGORY page
   ============================================================ */
.category-page {
  max-width: 1440px;
  margin: 0 auto;
  padding: 36px 56px 140px;
}
.category-head, .product-crumbs {
  font-family: var(--f-sans);
  font-size: 10.5px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: 70px;
}
.crumb-sep { margin: 0 12px; color: var(--hairline-strong); }
.crumb:hover { color: var(--gold); }
.crumb-active { color: var(--ink); }

.category-hero {
  text-align: center;
  margin-bottom: 100px;
  padding: 30px 0 50px;
  position: relative;
}
.category-hero::after {
  content: '';
  display: block;
  width: 60px;
  height: 1px;
  background: var(--gold);
  margin: 38px auto 0;
}
.category-eyebrow {
  font-family: var(--f-sans);
  font-size: 11px;
  letter-spacing: 0.34em;
  color: var(--gold);
  margin-bottom: 28px;
}
.category-title {
  font-family: var(--f-display);
  font-size: 88px;
  font-weight: 400;
  margin: 0 0 18px;
  line-height: 1;
  letter-spacing: 0;
}
:lang(zh-CN) .category-title { font-family: var(--f-zh); font-weight: 300; font-size: 64px; letter-spacing: 0.2em; padding-left: 0.2em; }
.category-sub {
  font-family: var(--f-serif);
  font-style: italic;
  font-size: 22px;
  color: var(--ink-soft);
  margin: 0 0 30px;
}
:lang(zh-CN) .category-sub { font-style: normal; font-family: var(--f-zh); font-size: 17px; letter-spacing: 0.16em; }
.category-count {
  font-family: var(--f-sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  color: var(--ink-mute);
  text-transform: uppercase;
}

/* ============================================================
   PRODUCT GRID
   ============================================================ */
.product-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 64px 48px;
}
.product-card {
  display: flex; flex-direction: column;
  transition: transform 320ms;
}
.product-card:hover { transform: translateY(-4px); }
.product-card-art {
  aspect-ratio: 1;
  background: var(--paper);
  border: 1px solid var(--hairline);
  position: relative;
  overflow: hidden;
  transition: box-shadow 380ms;
}
.product-card-art::before, .product-card-art::after {
  content: ''; position: absolute; pointer-events: none;
}
.product-card-art::before {
  inset: 14px; border: 1px solid var(--gold-soft); opacity: 0.45;
}
.product-card-art::after {
  inset: 18px; border: 1px solid var(--hairline); opacity: 0.7;
}
.product-card:hover .product-card-art {
  box-shadow: 0 50px 70px -50px rgba(60, 45, 25, 0.5);
}
.product-card-body { padding: 26px 8px 0; text-align: center; }
.product-card-name-en {
  font-family: var(--f-display);
  font-size: 24px;
  letter-spacing: 0;
  margin-bottom: 4px;
}
.product-card-name-zh {
  font-family: var(--f-zh);
  font-size: 14px;
  letter-spacing: 0.18em;
  color: var(--gold-deep);
  margin-bottom: 14px;
  padding-left: 0.18em;
}
.product-card-material {
  font-family: var(--f-sans);
  font-size: 10.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: 18px;
  min-height: 28px;
}
.product-card-discover {
  font-family: var(--f-sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink);
  border-top: 1px solid var(--hairline);
  padding-top: 16px;
  transition: color 220ms, border-color 220ms;
}
.product-card:hover .product-card-discover { color: var(--gold); border-color: var(--gold-soft); }

/* ─── Image stage: view rail beside the shot (upgrade design) ─── */
.product-stage { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 18px; align-items: start; }
.product-stage:not(:has(.product-rail)) { grid-template-columns: minmax(0, 1fr); }
.product-rail { display: flex; flex-direction: column; gap: 12px; }
.rail-thumb {
  width: 76px; height: 76px; padding: 0;
  background: var(--paper);
  border: 1px solid var(--hairline);
  overflow: hidden;
  transition: border-color 260ms, box-shadow 260ms, transform 260ms;
}
.rail-thumb img { display: block; width: 100%; height: 100%; object-fit: cover; mix-blend-mode: multiply; }
.rail-thumb:hover { border-color: var(--gold-soft); transform: translateY(-1px); }
.rail-thumb.is-active { border-color: var(--gold-deep); box-shadow: 0 0 0 1px var(--gold-deep) inset; }
.product-view-name {
  margin-top: 16px;
  font-family: var(--f-sans);
  font-size: 10.5px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--ink-mute);
  text-align: center;
}
/* view switcher — explicit segmented tabs under the shot + badge on the image */
.view-seg{ display:flex; justify-content:center; gap:0; margin:18px auto 0; width:max-content; max-width:100%;
  border:1px solid var(--gold-soft); }
.view-seg-opt{ min-width:96px; padding:11px 22px; background:transparent; border:0; border-left:1px solid var(--gold-soft);
  font-family:var(--f-sans); font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-soft);
  cursor:pointer; transition:background .25s, color .25s; }
:lang(zh-CN) .view-seg-opt{ font-family:var(--f-zh); font-size:14px; letter-spacing:.2em; text-transform:none; }
.view-seg-opt:first-child{ border-left:0; }
.view-seg-opt:hover{ background:rgba(201,165,90,.12); color:var(--gold-deep); }
.view-seg-opt.on{ background:var(--gold-deep); color:var(--paper); }
.view-seg-opt:focus-visible{ outline:1px solid var(--gold); outline-offset:2px; }
.view-badge{ position:absolute; left:16px; top:16px; z-index:4; padding:7px 14px;
  background:rgba(251,246,234,.92); border:1px solid var(--gold-soft); color:var(--gold-deep);
  font-family:var(--f-zh); font-size:13px; letter-spacing:.22em; pointer-events:none;
  animation:view-badge-in .4s cubic-bezier(.2,.7,.2,1) both; }
@keyframes view-badge-in{ from{ opacity:0; transform:translateY(-4px); } to{ opacity:1; transform:none; } }
@media (prefers-reduced-motion:reduce){ .view-badge{ animation:none; } }
@media (max-width:560px){ .view-seg{ width:100%; } .view-seg-opt{ flex:1; min-width:0; padding:11px 8px; } }
:lang(zh-CN) .product-view-name { font-family: var(--f-zh); font-size: 13px; letter-spacing: 0.18em; text-transform: none; }
@media (max-width: 900px) {
  .product-stage { grid-template-columns: minmax(0, 1fr); }
  .product-rail { flex-direction: row; flex-wrap: wrap; order: 2; }
}

/* ─── Multi-view image gallery (M/F watches & rings) ─────────── */
.product-gallery {
  margin-top: 36px;
  padding-top: 28px;
  border-top: 1px solid var(--hairline);
}
.product-gallery-label {
  font-family: var(--f-sans);
  font-size: 10.5px;
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 22px;
  text-align: center;
}
.product-gallery-thumbs {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(80px, 110px));
  gap: 16px;
  justify-content: center;
}
.gallery-thumb {
  display: flex; flex-direction: column;
  align-items: center;
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  transition: transform 240ms;
}
.gallery-thumb-frame {
  width: 100%;
  aspect-ratio: 1;
  background: radial-gradient(circle at 50% 42%, #fbf5e8 0%, #f1e7d3 60%, #d9c9a8 100%);
  border: 1px solid var(--hairline);
  position: relative;
  overflow: hidden;
  transition: border-color 240ms, transform 240ms, box-shadow 240ms;
}
.gallery-thumb-frame::before {
  content: ''; position: absolute; inset: 10px;
  border: 1px solid var(--gold-soft); opacity: 0.5;
  pointer-events: none;
  transition: opacity 240ms;
}
.gallery-thumb-frame img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: contain;
  padding: 10%;
  mix-blend-mode: multiply;
  transition: transform 380ms cubic-bezier(0.2, 0.7, 0.2, 1);
  filter: brightness(1.08) contrast(1.04) saturate(1.05);
}
.gallery-thumb:hover .gallery-thumb-frame img {
  transform: scale(1.05);
}
.gallery-thumb-label {
  margin-top: 14px;
  font-family: var(--f-sans);
  font-size: 11px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--ink-mute);
  transition: color 220ms;
}
.gallery-thumb:hover .gallery-thumb-frame {
  border-color: var(--gold-soft);
  transform: translateY(-3px);
  box-shadow: 0 30px 50px -30px rgba(60, 45, 25, 0.55);
}
.gallery-thumb:hover .gallery-thumb-label { color: var(--ink); }
.gallery-thumb.is-active .gallery-thumb-frame {
  border-color: var(--gold);
  box-shadow: 0 0 0 1px var(--gold), 0 30px 50px -30px rgba(60, 45, 25, 0.55);
}
.gallery-thumb.is-active .gallery-thumb-frame::before { opacity: 0.9; }
.gallery-thumb.is-active .gallery-thumb-label {
  color: var(--gold-deep);
  font-weight: 500;
}

@keyframes product-img-fade {
  from { opacity: 0; transform: scale(1.015); }
  to   { opacity: 1; transform: scale(1); }
}
/* Safe entrance: animates scale only, never opacity, so the photo is
   always visible (opacity:1) even if the animation is paused/skipped. */
.sy-img { transition: opacity 520ms cubic-bezier(0.2, 0.7, 0.2, 1); }
.sy-img:not([data-ld]) { opacity: 0; }
@media (prefers-reduced-motion: reduce) { .sy-img { transition: none; } }
@keyframes product-img-in {
  from { transform: scale(1.015); }
  to   { transform: scale(1); }
}

/* ============================================================
   PRODUCT DETAIL
   ============================================================ */
.product-page {
  max-width: 1440px;
  margin: 0 auto;
  padding: 36px 56px 80px;
}
.product-hero {
  display: grid;
  grid-template-columns: 1.05fr 1fr;
  gap: 100px;
  margin-bottom: 100px;
}
.product-image-col { position: sticky; top: 110px; align-self: start; }
.product-image-frame {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  background: var(--paper);
  border: 1px solid var(--hairline);
  position: relative;
  cursor: zoom-in;
  overflow: hidden;
  transition: box-shadow 400ms;
}
.product-image-frame::before, .product-image-frame::after {
  content: ''; position: absolute; pointer-events: none;
}
.product-image-frame::before { inset: 22px; border: 1px solid var(--gold-soft); opacity: 0.55; }
.product-image-frame::after  { inset: 28px; border: 1px solid var(--hairline); }
.product-image-frame:hover {
  box-shadow: 0 70px 90px -60px rgba(60, 45, 25, 0.55);
}
.zoom-cue {
  position: absolute;
  bottom: 40px; left: 50%; transform: translateX(-50%);
  background: rgba(26, 22, 20, 0.88);
  color: var(--cream-bright);
  padding: 12px 22px;
  display: inline-flex; align-items: center; gap: 12px;
  font-family: var(--f-sans);
  font-size: 10.5px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  opacity: 0;
  transition: opacity 300ms;
}
.product-image-frame:hover .zoom-cue { opacity: 1; }

.product-image-meta {
  display: flex;
  justify-content: space-between;
  margin-top: 24px;
  font-family: var(--f-sans);
  font-size: 10px;
  letter-spacing: 0.24em;
  color: var(--ink-mute);
  text-transform: uppercase;
}

.product-info-col { padding-top: 4px; }
.product-eyebrow {
  display: flex; justify-content: space-between; align-items: baseline;
  font-family: var(--f-sans);
  font-size: 11px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--gold);
  border-bottom: 1px solid var(--gold-soft);
  padding-bottom: 14px;
  margin-bottom: 38px;
}
.product-title { margin: 0 0 36px; line-height: 1; }
.product-title-en {
  display: block;
  font-family: var(--f-display);
  font-size: 68px;
  font-weight: 400;
  letter-spacing: 0;
  margin-bottom: 18px;
}
.product-title-zh {
  display: block;
  font-family: var(--f-zh);
  font-weight: 300;
  font-size: 28px;
  letter-spacing: 0.24em;
  color: var(--ink-soft);
  padding-left: 0.24em;
}
.product-prose {
  font-family: var(--f-serif);
  font-style: italic;
  font-size: 21px;
  line-height: 1.55;
  color: var(--ink-soft);
  margin: 0 0 56px;
  max-width: 50ch;
  text-wrap: pretty;
}
:lang(zh-CN) .product-prose { font-style: normal; font-family: var(--f-zh); font-size: 18px; line-height: 1.85; letter-spacing: 0.06em; }

.product-section {
  border-top: 1px solid var(--hairline);
  padding-top: 28px;
  margin-bottom: 36px;
}
.ps-label {
  font-family: var(--f-sans);
  font-size: 10.5px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 14px;
}
.ps-label--lg {
  display: flex; flex-direction: column; gap: 8px;
  margin-bottom: 28px;
}
.ps-label--lg > span:first-child { font-size: 13px; color: var(--ink); }
.ps-label-sub {
  font-family: var(--f-serif);
  font-size: 13px;
  font-style: italic;
  letter-spacing: 0.02em;
  color: var(--ink-mute);
  text-transform: none;
}
:lang(zh-CN) .ps-label-sub { font-family: var(--f-zh); font-style: normal; font-size: 12.5px; letter-spacing: 0.1em; }

.ps-body {
  font-size: 16px;
  line-height: 1.65;
  color: var(--ink-soft);
}
.ps-body--italic { font-style: italic; }
:lang(zh-CN) .ps-body--italic { font-style: normal; }

/* Activation ritual */
.product-section--activation { padding-top: 40px; }
.activation-steps {
  list-style: none;
  counter-reset: step;
  margin: 0; padding: 0;
}
.activation-steps li {
  display: grid;
  grid-template-columns: 76px 1fr;
  gap: 22px;
  padding: 26px 0;
  border-bottom: 1px solid var(--hairline);
}
.activation-steps li:last-child { border-bottom: 0; }
.step-num {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.step-num-digit {
  font-family: var(--f-display);
  font-size: 26px;
  color: var(--gold);
  line-height: 1;
  letter-spacing: 0.04em;
}
.step-num-icon {
  width: 48px;
  height: 48px;
  border: 1px solid var(--gold-soft);
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--gold);
  background: var(--paper);
  transition: border-color 240ms, color 240ms, transform 240ms, box-shadow 240ms;
}
.activation-steps li:hover .step-num-icon {
  border-color: var(--gold);
  color: var(--gold-deep);
  transform: translateY(-2px) scale(1.05);
  box-shadow: 0 10px 20px -10px rgba(60, 45, 25, 0.35);
}
.step-title {
  font-family: var(--f-sans);
  font-size: 10.5px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--ink);
  margin-bottom: 8px;
}
.step-text {
  font-size: 15.5px;
  line-height: 1.65;
  color: var(--ink-soft);
  max-width: 60ch;
}
.step-text p { margin: 0 0 12px; }
.step-text p:last-child { margin-bottom: 0; }

/* Gratitude phrase — blockquote */
.step-quote {
  margin: 24px 0 0;
  padding: 22px 28px;
  font-family: var(--f-serif);
  font-style: italic;
  font-size: 17px;
  line-height: 1.7;
  color: var(--ink);
  background: linear-gradient(to right, transparent, var(--paper) 6%, var(--paper) 94%, transparent);
  border-top: 1px solid var(--gold-soft);
  border-bottom: 1px solid var(--gold-soft);
  text-wrap: pretty;
  position: relative;
}
:lang(zh-CN) .step-quote { font-style: normal; font-family: var(--f-zh); line-height: 1.95; letter-spacing: 0.04em; }
.step-quote::before, .step-quote::after {
  content: ''; position: absolute;
  width: 18px; height: 1px;
  background: var(--gold);
  top: -1px;
}
.step-quote::before { left: 0; }
.step-quote::after { right: 0; bottom: -1px; top: auto; }

/* Rules table — for the writing practice / care list / rope-colour map */
.step-rules {
  margin: 18px 0 0;
  padding: 0;
  display: grid;
  gap: 0;
  border-top: 1px solid var(--hairline);
}
.step-rule {
  display: grid;
  grid-template-columns: 130px 1fr;
  gap: 24px;
  align-items: baseline;
  padding: 12px 4px;
  border-bottom: 1px solid var(--hairline);
}
.step-rule dt {
  font-family: var(--f-sans);
  font-size: 10px;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--gold-deep);
  padding-top: 2px;
  white-space: nowrap;
}
:lang(zh-CN) .step-rule dt {
  font-family: var(--f-zh);
  letter-spacing: 0.16em;
  text-transform: none;
  font-size: 13px;
  color: var(--gold-deep);
  font-weight: 400;
}
.step-rule dd {
  margin: 0;
  font-size: 14.5px;
  line-height: 1.6;
  color: var(--ink-soft);
}

/* Rope-colour step — show small color swatches beside each row */
.step-rules--rope .step-rule {
  grid-template-columns: 80px 80px 1fr;
  gap: 18px;
  align-items: center;
}
.step-rule-swatches {
  display: flex;
  gap: 4px;
  align-items: center;
  flex-wrap: wrap;
}
.step-rule-swatch {
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 1px solid rgba(0, 0, 0, 0.12);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.15);
}
@media (max-width: 640px) {
  .step-rules--rope .step-rule {
    grid-template-columns: 80px 1fr;
  }
  .step-rules--rope .step-rule dt { grid-row: 1; grid-column: 2; }
  .step-rules--rope .step-rule dd { grid-row: 2; grid-column: 1 / -1; padding-top: 6px; }
  .step-rules--rope .step-rule-swatches { grid-row: 1; grid-column: 1; }
}

/* Placement grid */
.places-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px;
  margin: 24px 0 0;
}
.place-card {
  background: var(--paper);
  border: 1px solid var(--hairline);
  padding: 24px 22px 22px;
  position: relative;
  transition: border-color 240ms, transform 240ms;
}
.place-card::before, .place-card::after {
  content: ''; position: absolute; pointer-events: none;
}
.place-card::before { inset: 6px; border: 1px solid var(--gold-soft); opacity: 0.5; }
.place-card:hover { border-color: var(--gold); transform: translateY(-2px); }
.place-num {
  position: absolute; top: 14px; right: 18px;
  font-family: var(--f-zh);
  font-size: 22px;
  color: var(--gold);
  font-weight: 300;
}
.place-title {
  font-family: var(--f-display);
  font-size: 22px;
  font-weight: 400;
  margin-bottom: 8px;
  color: var(--ink);
}
:lang(zh-CN) .place-title { font-family: var(--f-zh); font-weight: 400; font-size: 18px; letter-spacing: 0.08em; }
.place-note {
  font-family: var(--f-serif);
  font-style: italic;
  font-size: 14.5px;
  color: var(--ink-mute);
}
:lang(zh-CN) .place-note { font-style: normal; font-family: var(--f-zh); font-size: 13.5px; }

/* Warning strip */
.step-warn {
  margin: 22px 0 0;
  padding: 16px 22px;
  background: rgba(169, 138, 82, 0.08);
  border-left: 2px solid var(--gold);
  display: flex; align-items: flex-start; gap: 14px;
  font-size: 14.5px;
  line-height: 1.65;
  color: var(--ink-soft);
  font-style: italic;
}
:lang(zh-CN) .step-warn { font-style: normal; font-family: var(--f-zh); }
.step-warn-mark {
  font-family: var(--f-display);
  font-size: 18px;
  color: var(--gold);
  flex: 0 0 auto;
  margin-top: -2px;
}

@media (max-width: 700px) {
  .step-rule { grid-template-columns: 1fr; gap: 4px; padding: 12px 0; }
  .places-grid { grid-template-columns: 1fr; }
}
.activation-intro {
  font-family: var(--f-serif);
  font-style: italic;
  font-size: 18px;
  line-height: 1.6;
  color: var(--ink-soft);
  border-left: 1px solid var(--gold);
  padding: 6px 0 6px 24px;
  margin: 0 0 36px;
  max-width: 60ch;
}
:lang(zh-CN) .activation-intro { font-style: normal; font-family: var(--f-zh); line-height: 1.85; letter-spacing: 0.04em; }
.activation-closing {
  margin: 40px 0 0;
  padding: 24px 0 0;
  border-top: 1px solid var(--hairline);
  font-family: var(--f-serif);
  font-style: italic;
  font-size: 17px;
  line-height: 1.65;
  color: var(--ink-mute);
  text-align: center;
  text-wrap: pretty;
}
:lang(zh-CN) .activation-closing { font-style: normal; font-family: var(--f-zh); line-height: 1.9; }

/* Product nav */
.product-nav {
  display: grid;
  grid-template-columns: 1fr max-content 1fr;
  gap: 36px;
  align-items: center;
  border-top: 1px solid var(--hairline);
  border-bottom: 1px solid var(--hairline);
  padding: 32px 0;
  margin-top: 60px;
}
.product-nav-side {
  display: flex; flex-direction: column;
  font-family: var(--f-sans);
}
.product-nav-prev { text-align: left; }
.product-nav-next { text-align: right; }
.pn-eyebrow {
  font-size: 10px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 8px;
}
.pn-name {
  font-family: var(--f-display);
  font-size: 22px;
  color: var(--ink);
  transition: color 220ms;
}
:lang(zh-CN) .pn-name { font-family: var(--f-zh); font-size: 18px; letter-spacing: 0.08em; }
.product-nav-side:hover .pn-name { color: var(--gold); }
.product-nav-mid { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.product-nav-count {
  font-family: var(--f-serif);
  font-size: 15px;
  letter-spacing: 0.22em;
  color: var(--ink-mute);
}
.product-nav-back {
  font-family: var(--f-sans);
  font-size: 10.5px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--ink-mute);
  border-bottom: 1px solid var(--ink-mute);
  padding-bottom: 4px;
  transition: color 220ms, border-color 220ms;
}
.product-nav-back:hover { color: var(--gold); border-color: var(--gold); }

/* ============================================================
   ZOOM VIEWER
   ============================================================ */
.zoom-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(20, 16, 14, 0.96);
  display: flex; flex-direction: column;
  animation: fadeIn 240ms ease-out;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.zoom-chrome {
  flex: 0 0 auto;
  padding: 24px 56px;
  display: flex; align-items: center; justify-content: space-between;
  color: var(--cream-bright);
}
.zoom-chrome--top { border-bottom: 1px solid rgba(255, 247, 224, 0.1); }
.zoom-chrome--bottom { border-top: 1px solid rgba(255, 247, 224, 0.1); justify-content: center; gap: 16px; }
.zoom-title-en {
  font-family: var(--f-display);
  font-size: 26px;
  letter-spacing: 0;
}
.zoom-title-zh {
  font-family: var(--f-zh);
  font-size: 13px;
  letter-spacing: 0.28em;
  color: var(--gold-soft);
  margin-top: 4px;
  padding-left: 0.28em;
}
.zoom-close {
  color: var(--cream-bright);
  padding: 10px 18px;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--f-sans);
  font-size: 11px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  border: 1px solid rgba(255, 247, 224, 0.32);
  background: rgba(255, 247, 224, 0.05);
  transition: border-color 200ms, background 200ms, color 200ms;
}
.zoom-close:hover {
  border-color: var(--gold-soft);
  background: rgba(231, 201, 138, 0.15);
  color: var(--gold-soft);
}
.zoom-stage {
  flex: 1; min-height: 0;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  cursor: zoom-in;
  position: relative;
}
.zoom-stage.is-zoomed { cursor: grab; }
.zoom-stage.is-dragging { cursor: grabbing; }
.zoom-canvas {
  width: min(80vh, 80vw);
  aspect-ratio: 1;
  transition: transform 220ms cubic-bezier(0.2, 0.6, 0.2, 1);
  transform-origin: center;
  background: var(--paper);
  box-shadow:
    0 0 0 1px rgba(255, 247, 224, 0.08),
    0 80px 120px -40px rgba(0, 0, 0, 0.7);
}
.zoom-stage.is-dragging .zoom-canvas { transition: none; }
.zoom-btn {
  font-family: var(--f-sans);
  font-size: 14px;
  color: var(--cream-bright);
  border: 1px solid rgba(255, 247, 224, 0.25);
  width: 40px; height: 40px;
  display: inline-flex; align-items: center; justify-content: center;
  transition: border-color 200ms, color 200ms;
}
.zoom-btn:hover:not(:disabled) { border-color: var(--gold-soft); color: var(--gold-soft); }
.zoom-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.zoom-btn--mid { width: auto; padding: 0 16px; font-size: 12px; letter-spacing: 0.2em; }
.zoom-hint {
  margin-left: 20px;
  font-family: var(--f-sans);
  font-size: 10.5px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(255, 247, 224, 0.5);
}

/* ============================================================
   FOOTER
   ============================================================ */
.site-footer {
  position: relative;
  margin: 80px 0 0;
  padding: 64px 56px 50px;
  overflow: hidden;
  background: radial-gradient(120% 120% at 50% 0%, #f7f0e1 0%, #efe6d2 60%, #e6d8ba 100%);
}
html.atmosphere-obsidian .site-footer,
html.atmosphere-vermilion .site-footer {
  background: radial-gradient(120% 120% at 50% 0%, #221a12 0%, #18110a 60%, #0e0905 100%);
}
/* faint 天盘 behind the seal */
.footer-pan {
  position: absolute; left: 50%; top: 210px; width: 560px; height: 560px;
  transform: translate(-50%, -50%); opacity: 0.4; pointer-events: none; z-index: 0;
}
.footer-pan svg { width: 100%; height: 100%; display: block; }
.footer-pan-spin { animation: footer-pan-rot 120s linear infinite; transform-origin: 280px 280px; }
@keyframes footer-pan-rot { to { transform: rotate(360deg); } }
html.atmosphere-obsidian .footer-pan,
html.atmosphere-vermilion .footer-pan { opacity: 0.3; }

/* living gold seam */
.footer-seam {
  position: relative; height: 1px; margin-bottom: 56px;
  background: linear-gradient(to right, transparent, var(--gold-soft) 18%, var(--gold-soft) 82%, transparent);
  transform: scaleX(0); transform-origin: center;
  transition: transform 1100ms cubic-bezier(0.2, 0.7, 0.2, 1);
}
.site-footer.in-view .footer-seam { transform: scaleX(1); }
.footer-seam::after {
  content: ''; position: absolute; top: -1px; left: 0; width: 14%; height: 3px;
  background: linear-gradient(to right, transparent, rgba(255, 240, 200, 0.95), transparent);
  filter: blur(1px); animation: footer-glint 7s ease-in-out infinite;
}
@keyframes footer-glint { 0% { left: -15%; } 55%, 100% { left: 100%; } }

/* seal monogram */
.footer-seal {
  position: relative; z-index: 2; text-align: center; margin-bottom: 8px;
  opacity: 0; transform: translateY(20px);
  transition: opacity 1000ms 0.15s ease, transform 1000ms 0.15s cubic-bezier(0.2, 0.7, 0.2, 1);
}
.site-footer.in-view .footer-seal { opacity: 1; transform: none; }
.footer-seal-ring {
  display: inline-flex; align-items: center; justify-content: center;
  width: 96px; height: 96px; border: 1px solid var(--gold-soft); border-radius: 50%; position: relative;
}
.footer-seal-ring::before { content: ''; position: absolute; inset: 6px; border: 1px solid rgba(169, 138, 82, 0.4); border-radius: 50%; }
.footer-seal-ring b { font-family: var(--f-zh); font-weight: 300; font-size: 38px; color: var(--gold-deep); letter-spacing: 0.04em; }
.footer-seal-mark { display: block; font-family: var(--f-display); font-size: 26px; letter-spacing: 0.42em; padding-left: 0.42em; color: var(--ink); margin-top: 22px; }
.footer-seal-couplet {
  display: block; font-family: var(--f-serif); font-style: italic; font-size: 18px; color: var(--ink-mute); margin-top: 12px;
  opacity: 0; transition: opacity 1100ms 0.5s ease;
}
.site-footer.in-view .footer-seal-couplet { opacity: 1; }
:lang(zh-CN) .footer-seal-couplet { font-style: normal; font-family: var(--f-zh); letter-spacing: 0.06em; }
html.atmosphere-obsidian .footer-seal-mark,
html.atmosphere-vermilion .footer-seal-mark { color: var(--cream); }
.footer-grid {
  position: relative; z-index: 2;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0;
  max-width: 1080px;
  margin: 54px auto 56px;
  padding: 0 24px;
}
.footer-col { text-align: center; padding: 6px 44px; position: relative; opacity: 0; transform: translateY(22px); transition: opacity 900ms ease, transform 900ms cubic-bezier(0.2, 0.7, 0.2, 1); }
.footer-col + .footer-col::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 1px; background: linear-gradient(180deg, transparent, rgba(169,138,82,.45) 20%, rgba(169,138,82,.45) 80%, transparent); }
.site-footer.in-view .footer-col { opacity: 1; transform: none; }
.site-footer.in-view .footer-col:nth-child(1) { transition-delay: 0.3s; }
.site-footer.in-view .footer-col:nth-child(2) { transition-delay: 0.42s; }
.site-footer.in-view .footer-col:nth-child(3) { transition-delay: 0.54s; }
.footer-eyebrow {
  font-family: var(--f-sans);
  font-size: 11px;
  letter-spacing: 0.42em;
  text-transform: uppercase;
  color: var(--gold-deep);
  margin-bottom: 18px;
  padding-left: 0.42em;
  display: inline-block;
  position: relative;
}
.footer-eyebrow::after {
  content: ''; position: absolute; left: 0; bottom: -5px; width: 100%; height: 1px;
  background: var(--gold); transform: scaleX(0); transform-origin: center;
  transition: transform 400ms cubic-bezier(0.2, 0.7, 0.2, 1);
}
.footer-col:hover .footer-eyebrow::after { transform: scaleX(1); }
.footer-grid p {
  margin: 0;
  font-size: 14.5px;
  line-height: 1.8;
  color: var(--ink-mute);
  max-width: 19em;
  margin-inline: auto;
  text-wrap: balance;
}
.footer-catalogue {
  display: flex;
  justify-content: center;
  margin: 8px 0 40px;
}
.catalogue-btn {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 16px 38px;
  border: 1px solid var(--gold);
  background: none;
  cursor: pointer;
  color: var(--ink);
  font-family: var(--f-sans);
  font-size: 11px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  position: relative;
  overflow: hidden;
  transition: color 280ms, letter-spacing 280ms;
}
.catalogue-btn::before {
  content: '';
  position: absolute; inset: 0;
  background: var(--gold);
  transform: translateX(-101%);
  transition: transform 420ms cubic-bezier(0.2, 0.7, 0.2, 1);
  z-index: -1;
}
.catalogue-btn:hover { color: var(--paper); letter-spacing: 0.34em; }
.catalogue-btn:hover::before { transform: translateX(0); }
.catalogue-btn svg { transition: transform 280ms; }
.catalogue-btn:hover svg { transform: translateY(-1px); }
.footer-base {
  position: relative; z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid var(--hairline);
  padding-top: 28px;
  font-family: var(--f-sans);
  font-size: 10.5px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--ink-mute);
}
.footer-totop {
  display: inline-flex; flex-direction: column; align-items: center; gap: 8px;
  background: none; border: 0; cursor: pointer;
  font-family: var(--f-sans); font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--gold-deep);
}
.footer-totop-ln { width: 1px; height: 26px; background: var(--hairline-strong); position: relative; overflow: hidden; }
.footer-totop-ln::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -26px; height: 26px;
  background: var(--gold); transition: bottom 400ms ease;
}
.footer-totop:hover .footer-totop-ln::after { bottom: 0; }
@media (prefers-reduced-motion: reduce) {
  .footer-pan-spin { animation: none; }
  .footer-seam, .footer-seal, .footer-col, .footer-seal-couplet { transition: none; opacity: 1; transform: none; }
  .footer-seam { transform: scaleX(1); }
  .footer-seam::after { animation: none; }
}

/* ============================================================
   CATALOGUE / DOWNLOAD — language picker modal
   ============================================================ */
.cat-modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 1200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(26, 22, 20, 0);
  backdrop-filter: blur(0px);
  transition: background 260ms ease, backdrop-filter 260ms ease;
}
.cat-modal-overlay.is-open {
  background: rgba(26, 22, 20, 0.46);
  backdrop-filter: blur(3px);
}
.cat-modal {
  position: relative;
  width: 100%;
  max-width: 440px;
  background: var(--paper, #fbf6ea);
  border: 1px solid rgba(26, 22, 20, 0.16);
  box-shadow: 0 40px 90px -40px rgba(40, 30, 16, 0.6);
  padding: 46px 44px 38px;
  text-align: center;
  transform: translateY(14px) scale(0.98);
  opacity: 0;
  transition: transform 320ms cubic-bezier(0.2, 0.7, 0.2, 1), opacity 320ms ease;
}
.cat-modal-overlay.is-open .cat-modal { transform: translateY(0) scale(1); opacity: 1; }
.cat-modal::before {
  content: '';
  position: absolute;
  inset: 12px;
  border: 1px solid var(--gold-soft, #c5a872);
  opacity: 0.45;
  pointer-events: none;
}
.cat-modal-close {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  background: none;
  color: var(--ink-mute, #6b605a);
  cursor: pointer;
  border-radius: 50%;
  transition: color 200ms, background 200ms;
}
.cat-modal-close:hover { color: var(--ink, #1a1614); background: rgba(169, 138, 82, 0.12); }
.cat-modal-mk {
  font-family: var(--f-display, 'Italiana', serif);
  font-size: 20px;
  letter-spacing: 0.34em;
  padding-left: 0.34em;
  color: var(--ink, #1a1614);
}
.cat-modal-eyebrow {
  font-family: var(--f-sans, 'Inter', sans-serif);
  font-size: 9px;
  letter-spacing: 0.42em;
  text-transform: uppercase;
  color: var(--gold, #a98a52);
  margin: 8px 0 26px;
}
.cat-modal-title {
  font-family: var(--f-display, 'Italiana', serif);
  font-size: 27px;
  font-weight: 400;
  margin: 0 0 8px;
  color: var(--ink, #1a1614);
}
.cat-modal-sub {
  font-family: var(--f-serif, 'Cormorant Garamond', serif);
  font-style: italic;
  font-size: 14.5px;
  line-height: 1.55;
  color: var(--ink-soft, #3a3431);
  margin: 0 auto 26px;
  max-width: 30ch;
}
.cat-modal-list {
  display: flex;
  flex-direction: column;
  gap: 9px;
  text-align: left;
}
.cat-lang-opt {
  position: relative;
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 14px 16px;
  background: rgba(255, 255, 255, 0.35);
  border: 1px solid rgba(26, 22, 20, 0.14);
  cursor: pointer;
  transition: border-color 220ms, background 220ms, transform 180ms;
}
.cat-lang-opt:hover { border-color: var(--gold, #a98a52); background: rgba(169, 138, 82, 0.08); transform: translateX(2px); }
.cat-lang-opt.is-current { border-color: var(--gold-soft, #c5a872); background: rgba(169, 138, 82, 0.07); }
.cat-lang-native {
  font-family: var(--f-serif, 'Cormorant Garamond', serif);
  font-size: 19px;
  color: var(--ink, #1a1614);
}
.cat-lang-label {
  font-family: var(--f-sans, 'Inter', sans-serif);
  font-size: 9.5px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-mute, #6b605a);
}
.cat-lang-tag {
  font-family: var(--f-sans, 'Inter', sans-serif);
  font-size: 8px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gold, #a98a52);
  border: 1px solid var(--gold-soft, #c5a872);
  padding: 2px 7px;
  border-radius: 999px;
  margin-left: 4px;
}
.cat-lang-arrow {
  margin-left: auto;
  color: var(--gold, #a98a52);
  opacity: 0;
  transform: translateX(-6px);

  <style>/* ============================================================
   Cinematic hero — animated/flowing 3D homepage section
   ============================================================ */

.cinematic-hero {
  position: relative;
  width: 100%;
  min-height: 100vh;
  overflow: hidden;
  perspective: 1400px;

/* ─── Silk-flowing background ──────────────────────────────────── */
.silk-flow { position: absolute; inset: 0; z-index: 1; opacity: 0.85; mix-blend-mode: screen; }
html.atmosphere-bone .silk-flow { mix-blend-mode: multiply; opacity: 0.55; }
.silk-layer {
  position: absolute; inset: -25%;
  background-repeat: no-repeat;
  filter: blur(60px);
  will-change: transform, opacity;
  animation: silk-drift 28s ease-in-out infinite alternate;
}
.silk-layer--1 {
  background-image: radial-gradient(ellipse 60% 50% at 30% 40%, rgba(212, 168, 87, 0.55), transparent 70%);
  animation-delay: 0s;
}
.silk-layer--2 {
  background-image: radial-gradient(ellipse 55% 65% at 70% 60%, rgba(231, 201, 138, 0.55), transparent 70%);
  animation-duration: 36s;
  animation-direction: alternate-reverse;
  animation-delay: -8s;
}
.silk-layer--3 {
  background-image: radial-gradient(ellipse 70% 40% at 50% 80%, rgba(196, 147, 79, 0.4), transparent 75%);
  animation-duration: 42s;
  animation-delay: -16s;
}
html.atmosphere-obsidian .silk-layer--1 { background-image: radial-gradient(ellipse 60% 50% at 30% 40%, rgba(212, 168, 87, 0.4), transparent 70%); }
html.atmosphere-obsidian .silk-layer--2 { background-image: radial-gradient(ellipse 55% 65% at 70% 60%, rgba(232, 201, 138, 0.35), transparent 70%); }
html.atmosphere-obsidian .silk-layer--3 { background-image: radial-gradient(ellipse 70% 40% at 50% 80%, rgba(166, 117, 49, 0.45), transparent 75%); }
html.atmosphere-vermilion .silk-layer--1 { background-image: radial-gradient(ellipse 60% 50% at 30% 40%, rgba(255, 100, 70, 0.4), transparent 70%); }
html.atmosphere-vermilion .silk-layer--2 { background-image: radial-gradient(ellipse 55% 65% at 70% 60%, rgba(232, 201, 138, 0.45), transparent 70%); }
html.atmosphere-vermilion .silk-layer--3 { background-image: radial-gradient(ellipse 70% 40% at 50% 80%, rgba(180, 60, 40, 0.55), transparent 75%); }
html.atmosphere-celadon .silk-layer--1 { background-image: radial-gradient(ellipse 60% 50% at 30% 40%, rgba(160, 175, 130, 0.55), transparent 70%); }
html.atmosphere-celadon .silk-layer--2 { background-image: radial-gradient(ellipse 55% 65% at 70% 60%, rgba(180, 165, 95, 0.4), transparent 70%); }
html.atmosphere-celadon .silk-layer--3 { background-image: radial-gradient(ellipse 70% 40% at 50% 80%, rgba(130, 152, 110, 0.55), transparent 75%); }

@keyframes silk-drift {
  0%   { transform: translate(-4%, -3%) scale(1.05) rotate(-2deg); }
  25%  { transform: translate(3%, 4%) scale(1.1) rotate(1deg); }
  50%  { transform: translate(5%, -2%) scale(1.08) rotate(2deg); }
  75%  { transform: translate(-2%, 3%) scale(1.12) rotate(-1deg); }
  100% { transform: translate(2%, -4%) scale(1.06) rotate(-2deg); }
}

/* ─── Particle field ───────────────────────────────────────────── */
.hero-particles {

  width: 100%; height: 100%;

  mix-blend-mode: screen;

html.atmosphere-bone .hero-particles { mix-blend-mode: multiply; opacity: 0.7; }

/* ─── 3D parallax stage ────────────────────────────────────────── */
.parallax-stage {
  position: absolute; inset: 0;
  z-index: 3;
  pointer-events: none;
  transform-style: preserve-3d;
}
.parallax-stage-inner {
  position: relative;

/* Concentric breathing orbs behind the emblem */
.hero-orb {

.hero-orb--1 { width: 22vw; height: 22vw; max-width: 380px; max-height: 380px; animation-delay: 0s; }

@keyframes orb-breathe {

/* Floating product portraits */

.floating-piece-frame {

/* ─── Foreground text & CTAs ───────────────────────────────────── */
.cinematic-foreground {

  <style>/* ============================================================
   home-sections.css — Five Elements wheel + By the Numbers strip
   ============================================================ */

/* ─── Five Elements ──────────────────────────────────────────── */
.five-elements {
  position: relative;
  max-width: 1280px;
  margin: 0 auto;
  padding: 140px 56px 100px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 80px;
  align-items: center;
}
.fe-header { padding-right: 20px; }
.fe-eyebrow {
  font-family: var(--f-sans);
  font-size: 10.5px;
  letter-spacing: 0.42em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 36px;
}
.fe-title {
  margin: 0 0 36px;
  line-height: 1;
  display: flex; flex-direction: column;
  gap: 12px;
}
.fe-title-en {
  display: block;
  font-family: var(--f-display);
  font-weight: 400;
  font-size: clamp(40px, 5vw, 64px);
  letter-spacing: 0;
  background: linear-gradient(180deg, var(--ink) 30%, var(--gold-deep) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.fe-title-zh {
  display: block;
  font-family: var(--f-zh);
  font-weight: 300;
  font-size: clamp(20px, 2.4vw, 28px);
  letter-spacing: 0.36em;
  color: var(--gold);
  padding-left: 0.36em;
}
.fe-prose {
  font-family: var(--f-serif);
  font-style: italic;
  font-size: 17px;
  line-height: 1.7;
  color: var(--ink-soft);
  max-width: 50ch;
  margin: 0;
  text-wrap: pretty;
}
:lang(zh-CN) .fe-prose { font-style: normal; font-family: var(--f-zh); letter-spacing: 0.04em; }

/* The wheel */
.fe-wheel {
  position: relative;
  aspect-ratio: 1;
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
}
.fe-wheel-orbit {
  position: absolute;
  border-radius: 50%;
  border: 1px solid var(--gold-soft);
  inset: 0;
  opacity: 0.45;
  pointer-events: none;
  animation: fe-orbit-breathe 9s ease-in-out infinite;
}
.fe-wheel-orbit--1 { inset: 6%; opacity: 0.6; animation-delay: -1.2s; }
.fe-wheel-orbit--2 { inset: 22%; opacity: 0.3; animation-delay: -3.6s; border-style: dashed; }
@keyframes fe-orbit-breathe {
  0%, 100% { transform: scale(1); opacity: var(--o, 0.45); }
  50%      { transform: scale(1.03); opacity: calc(var(--o, 0.45) * 0.6); }
}
.fe-wheel-lines {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  animation: fe-lines-rotate 90s linear infinite;
  pointer-events: none;
}
@keyframes fe-lines-rotate {
  to { transform: rotate(360deg); }
}

/* Centre */
.fe-wheel-centre {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  pointer-events: none;
}
.fe-wheel-centre-glyph {
  font-family: var(--f-zh);
  font-size: clamp(40px, 6vw, 64px);
  color: var(--gold);
  font-weight: 300;
  opacity: 0.65;
  line-height: 1;
}
.fe-wheel-centre-en {
  font-family: var(--f-sans);
  font-size: 9.5px;
  letter-spacing: 0.42em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-top: 12px;
}
:lang(zh-CN) .fe-wheel-centre-en { display: none; }

/* Element nodes — floating circles around the wheel */
.fe-node {
  position: absolute;
  transform: translate(-50%, -50%);
  text-align: center;
  cursor: default;
  animation: fe-node-float 14s ease-in-out infinite;
}
@keyframes fe-node-float {
  0%, 100% { transform: translate(-50%, -50%) translateY(-3px); }
  50%      { transform: translate(-50%, -50%) translateY(3px); }
}
.fe-node-circle {
  width: 88px; height: 88px;
  border-radius: 50%;
  border: 1px solid var(--node-tone);
  background: rgba(251, 246, 234, 0.85);

  -webkit-backdrop-filter: blur(8px);
  box-shadow:
    0 0 0 6px rgba(251, 246, 234, 0.45),
    0 30px 50px -30px rgba(60, 45, 25, 0.4),

.fe-node:hover .fe-node-circle {
  transform: scale(1.08);
  border-color: var(--node-tone);
  box-shadow:

.fe-node-glyph {
  font-family: var(--f-zh);
  font-size: 36px;
  font-weight: 400;
  color: var(--node-tone);
  line-height: 1;
}
.fe-node-tag {
  margin-top: 12px;
  text-align: center;
}
.fe-node-name {
  font-family: var(--f-display);
  font-size: 16px;
  color: var(--ink);
  letter-spacing: 0.02em;

:lang(zh-CN) .fe-node-name { font-family: var(--f-zh); font-weight: 400; font-size: 15px; letter-spacing: 0.1em; }
.fe-node-sub {

  font-style: italic;

  color: var(--ink-mute);
}
:lang(zh-CN) .fe-node-sub { font-style: normal; font-family: var(--f-zh); font-size: 11.5px; }

/* ─── By the Numbers ─────────────────────────────────────────── */
.by-numbers {
  max-width: 1440px;
  margin: 60px auto 100px;
  padding: 0 56px;
}
.bn-rule {
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold-soft) 20%, var(--gold) 50%, var(--gold-soft) 80%, transparent);

.bn-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 0;
  padding: 60px 0;
}
.bn-cell {
  text-align: center;
  padding: 0 20px;
  border-right: 1px solid var(--hairline);
  transition: transform 320ms;
}
.bn-cell:last-child { border-right: 0; }
.bn-cell:hover { transform: translateY(-4px); }
.bn-num {
  font-family: var(--f-display);
  font-size: clamp(56px, 7vw, 92px);
  font-weight: 400;
  color: var(--ink);
  letter-spacing: -0.01em;
  line-height: 1;
  margin-bottom: 18px;
  background: linear-gradient(180deg, var(--ink) 20%, var(--gold-deep) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.bn-label {
  font-family: var(--f-sans);
  font-size: 10.5px;
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: var(--ink-mute);
  line-height: 1.5;
}
:lang(zh-CN) .bn-label { letter-spacing: 0.28em; }

/* ─── Responsive ─────────────────────────────────────────────── */
@media (max-width: 1100px) {
  .five-elements {
    grid-template-columns: 1fr;
    gap: 48px;
    padding: 80px 32px;
  }
  .fe-wheel { max-width: 440px; }
  .by-numbers { padding: 0 32px; }
  .bn-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 36px 0;
    padding: 36px 0;
  }
  .bn-cell { border-right: 0; padding: 20px; }
  .bn-cell:nth-child(odd) { border-right: 1px solid var(--hairline); }
  .bn-cell:last-child { grid-column: 1 / -1; }
}
@media (max-width: 640px) {
  .fe-node-circle { width: 64px; height: 64px; }
  .fe-node-glyph { font-size: 26px; }
  .fe-node-tag { margin-top: 8px; }
  .fe-node-name { font-size: 13px; }
  .fe-node-sub { font-size: 11px; }
}

@media (prefers-reduced-motion: reduce) {
  .fe-wheel-orbit, .fe-wheel-lines, .fe-node, .bn-rule {
    animation: none !important;
  }
  .fe-node {
    transform: translate(-50%, -50%) !important;
  }
}

   home-five-effects.css — refined "material reveal" click effects

/* full-screen layer + vignette focus */
.fe5-overlay { position: fixed; inset: 0; z-index: 90; pointer-events: none; }

/* shared element tints */
.fe5-tint { position: absolute; inset: 0; opacity: 0; }
.fe5-tint--metal { background: radial-gradient(circle at 50% 50%, rgba(255,240,205,.4), transparent 60%); }
.fe5-tint--wood  { background: radial-gradient(circle at 50% 50%, rgba(150,190,120,.34), transparent 60%); }

.fe5-wsvg { position: absolute; left: 50%; top: 50%; width: 560px; height: 560px; transform: translate(-50%,-50%); overflow: visible; }

  <style>/* ============================================================
   page-ambient.css — flowing effects for non-home pages
   A subtle gold bloom that drifts behind content, plus gentle
   entrance animations for sections and product cards.
   ============================================================ */

/* ─── Ambient bloom (sits behind category/product/index pages) ── */
.page-ambient {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
  contain: strict;
}
.page-ambient-glow {
  position: absolute;
  width: 70vw; height: 70vw;
  max-width: 1000px; max-height: 1000px;
  border-radius: 50%;
  filter: blur(40px);
  opacity: 0.45;
  /* Promoted up front so the first scroll frame never pays for layer creation */
  will-change: transform;
  transform: translateZ(0);
  backface-visibility: hidden;
}
.page-ambient-glow--1 {
  top: -10%; left: -15%;
  background: radial-gradient(circle, rgba(231, 201, 138, 0.6), transparent 70%);
  animation: amb-drift-1 36s ease-in-out infinite alternate;
}
.page-ambient-glow--2 {
  bottom: -20%; right: -15%;
  background: radial-gradient(circle, rgba(196, 147, 79, 0.4), transparent 70%);
  animation: amb-drift-2 44s ease-in-out infinite alternate;
}
.page-ambient-glow--3 {
  top: 35%; right: 20%;
  width: 40vw; height: 40vw;
  background: radial-gradient(circle, rgba(212, 168, 87, 0.3), transparent 70%);
  animation: amb-drift-3 52s ease-in-out infinite alternate;
}
html.atmosphere-obsidian .page-ambient-glow { opacity: 0.35; }
html.atmosphere-obsidian .page-ambient-glow--1 { background: radial-gradient(circle, rgba(212, 168, 87, 0.45), transparent 70%); }
html.atmosphere-obsidian .page-ambient-glow--2 { background: radial-gradient(circle, rgba(166, 117, 49, 0.5), transparent 70%); }
html.atmosphere-vermilion .page-ambient-glow--1 { background: radial-gradient(circle, rgba(180, 60, 40, 0.45), transparent 70%); }
html.atmosphere-vermilion .page-ambient-glow--2 { background: radial-gradient(circle, rgba(232, 201, 138, 0.35), transparent 70%); }
html.atmosphere-celadon .page-ambient-glow--1 { background: radial-gradient(circle, rgba(160, 175, 130, 0.55), transparent 70%); }
html.atmosphere-celadon .page-ambient-glow--2 { background: radial-gradient(circle, rgba(180, 165, 95, 0.4), transparent 70%); }
html.atmosphere-celadon .page-ambient-glow--3 { background: radial-gradient(circle, rgba(130, 152, 110, 0.45), transparent 70%); }

@keyframes amb-drift-1 {
  0%   { transform: translate(0, 0) scale(1); }
  50%  { transform: translate(8vw, 6vh) scale(1.1); }
  100% { transform: translate(4vw, -4vh) scale(0.95); }
}
@keyframes amb-drift-2 {
  0%   { transform: translate(0, 0) scale(1); }
  50%  { transform: translate(-6vw, -8vh) scale(1.05); }
  100% { transform: translate(-3vw, 5vh) scale(1.1); }
}
@keyframes amb-drift-3 {
  0%   { transform: translate(0, 0) scale(0.95); }
  50%  { transform: translate(-10vw, 10vh) scale(1.15); }
  100% { transform: translate(5vw, -6vh) scale(1); }
}

/* Ensure content sits above the ambient layer */
.page-shell { position: relative; z-index: 1; }

/* ─── Per-page entrance animations ──────────────────────────────── */
.page-shell > main {
  animation: page-enter 800ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
@keyframes page-enter {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Stagger entrance for product cards within a grid */
.product-grid .product-card {
  opacity: 0;
  transform: translateY(20px);
  animation: card-enter 800ms cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
}
.product-grid .product-card:nth-child(1)  { animation-delay: 80ms; }
.product-grid .product-card:nth-child(2)  { animation-delay: 140ms; }
.product-grid .product-card:nth-child(3)  { animation-delay: 200ms; }
.product-grid .product-card:nth-child(4)  { animation-delay: 260ms; }
.product-grid .product-card:nth-child(5)  { animation-delay: 320ms; }
.product-grid .product-card:nth-child(6)  { animation-delay: 380ms; }
.product-grid .product-card:nth-child(7)  { animation-delay: 440ms; }
.product-grid .product-card:nth-child(8)  { animation-delay: 500ms; }
.product-grid .product-card:nth-child(9)  { animation-delay: 560ms; }
.product-grid .product-card:nth-child(n+10) { animation-delay: 620ms; }

.product-info-col > *:nth-child(2) { animation-delay: 360ms; }
.product-info-col > *:nth-child(3) { animation-delay: 440ms; }
.product-info-col > *:nth-child(4) { animation-delay: 520ms; }
.product-info-col > *:nth-child(5) { animation-delay: 600ms; }

.site-header::after {

    transform: none !important;

          mask-image: radial-gradient(ellipse 70% 74% at 50% 52%, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0.55) 30%, #000 52%, rgba(0,0,0,0.5) 80%, transparent 100%);

  <style>/* ============================================================
   product-actions.css — Action bar, favorites, search palette.
   ============================================================ */

/* ─── Product action bar ─────────────────────────────────────── */
.product-actions {
  display: flex;
  gap: 8px;
  align-items: center;
  margin: 0 0 36px;
  flex-wrap: wrap;
}
.pa-spacer { flex: 1; min-width: 8px; }

.pa-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 16px;
  border: 1px solid var(--hairline-strong);
  background: rgba(251, 246, 234, 0.6);
  color: var(--ink-soft);
  font-family: var(--f-sans);
  font-size: 10.5px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  cursor: pointer;
  transition: border-color 220ms, color 220ms, background 220ms, transform 220ms;
  position: relative;
  overflow: hidden;
}
.pa-btn::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(120deg, transparent 0%, rgba(231, 201, 138, 0.25) 50%, transparent 100%);
  transform: translateX(-110%);
  transition: transform 600ms ease;
  pointer-events: none;
}
.pa-btn:hover {
  border-color: var(--gold);
  color: var(--ink);
  background: var(--paper);
}
.pa-btn:hover::before { transform: translateX(110%); }
.pa-btn--back {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
}
.pa-btn--back:hover {
  background: var(--gold-deep);
  border-color: var(--gold-deep);
  color: var(--paper);
}
.pa-btn--active {
  border-color: var(--gold);
  color: var(--gold-deep);
  background: rgba(231, 201, 138, 0.18);
}
.pa-btn--active svg { color: var(--gold); }

/* ─── Heart icon (used on cards) ─────────────────────────────── */
.fav-heart {
  background: rgba(255, 247, 230, 0.85);
  border: 1px solid var(--hairline);
  border-radius: 50%;
  width: 36px; height: 36px;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--ink-mute);
  cursor: pointer;
  transition: color 220ms, transform 220ms, background 220ms, border-color 220ms;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.fav-heart:hover {
  color: var(--gold);
  border-color: var(--gold-soft);
  transform: scale(1.08);
}
.fav-heart.is-fav {
  color: #c14444;
  border-color: #c14444;
}
.fav-heart.is-fav svg {
  animation: heart-pop 480ms cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes heart-pop {
  0% { transform: scale(0.7); }
  60% { transform: scale(1.25); }
  100% { transform: scale(1); }
}
/* Heart on product cards — positioned over the art */
.product-card { position: relative; }
.product-card .fav-heart {
  position: absolute;
  top: 12px; right: 12px;
  z-index: 2;
  opacity: 0;
  transition: opacity 240ms;
}
.product-card:hover .fav-heart,

  animation: sk-water-rise 6s ease-in-out infinite alternate;
  transform-origin: center bottom;
}
@keyframes sk-water-rise {
  0%   { transform: translateY(2px); }
  100% { transform: translateY(-2px); }
}
.sk-wave {
  animation: sk-wave-shift 4s ease-in-out infinite alternate;
}
.sk-wave--2 {
  animation-duration: 5.2s;
  animation-delay: -1s;
}
@keyframes sk-wave-shift {
  0%   { transform: translateX(-2px); }
  100% { transform: translateX(2px); }
}

/* Bath — submerged piece sways gently; bubbles rise */
.sk-bath-piece {
  transform-origin: 110px 145px;
  animation: sk-piece-sway 5s ease-in-out infinite;
}
@keyframes sk-piece-sway {
  0%, 100% { transform: rotate(-1.5deg); }
  50%      { transform: rotate(1.5deg); }
}
.sk-bubble {
  animation: sk-bubble-up 4s linear infinite;
}
.sk-b1 { animation-delay: 0s; }
.sk-b2 { animation-delay: -1.2s; }
.sk-b3 { animation-delay: -2.4s; }
.sk-b4 { animation-delay: -3.0s; }
@keyframes sk-bubble-up {
  0%   { transform: translateY(0); opacity: 0; }
  10%  { opacity: 0.7; }
  90%  { opacity: 0.7; }
  100% { transform: translateY(-90px); opacity: 0; }
}

/* Sunrise / air & sun — sun gentle bob + ray drift */
.step-sketch--sunrise .sk-rise {
  transform-origin: 110px 130px;
  animation: sk-sun-rise 8s ease-in-out infinite alternate;
}
@keyframes sk-sun-rise {
  0%   { transform: translateY(4px); }
  100% { transform: translateY(-2px); }
}
.step-sketch--sunrise .sk-glow line:nth-child(1) { animation: sk-glow-flow 4s linear infinite; }
.step-sketch--sunrise .sk-glow line:nth-child(2) { animation: sk-glow-flow 4s linear infinite -1.5s; }
.step-sketch--sunrise .sk-glow line:nth-child(3) { animation: sk-glow-flow 4s linear infinite -3s; }
@keyframes sk-glow-flow {
  0%   { opacity: 0; }
  50%  { opacity: 0.75; }
  100% { opacity: 0; }
}

.step-sketch--sun .sk-sun {
  transform-origin: 55px 58px;
  animation: sk-sun-rot 60s linear infinite;
}
@keyframes sk-sun-rot { to { transform: rotate(360deg); } }
.step-sketch--sun .sk-light-rays line {
  stroke-dashoffset: 0;
  animation: sk-rays-flow 3s linear infinite;
}
.step-sketch--sun .sk-light-rays line:nth-child(2) { animation-delay: -1s; }
.step-sketch--sun .sk-light-rays line:nth-child(3) { animation-delay: -2s; }
@keyframes sk-rays-flow {
  to { stroke-dashoffset: -20; }
}

/* Wipe — tissue gently breathes */
.step-sketch--wipe .sk-tissue {
  transform-origin: 110px 100px;
  animation: sk-tissue-breathe 6s ease-in-out infinite alternate;
}
@keyframes sk-tissue-breathe {
  0%   { transform: scale(0.99); }
  100% { transform: scale(1.01); }
}

/* Night — moon gentle bob + Zs drift up */
.step-sketch--night .sk-moon {
  transform-origin: 168px 50px;
  animation: sk-moon-bob 8s ease-in-out infinite alternate;
}
@keyframes sk-moon-bob {
  0%   { transform: translateY(2px); }
  100% { transform: translateY(-3px); }
}
.step-sketch--night .sk-zs text:nth-child(1) {
  animation: sk-z-drift 4s ease-in-out infinite;
}
.step-sketch--night .sk-zs text:nth-child(2) {
  animation: sk-z-drift 4s ease-in-out infinite -1.5s;
}
@keyframes sk-z-drift {
  0%   { transform: translate(0, 0); opacity: 0; }
  20%  { opacity: 0.8; }
  100% { transform: translate(-6px, -18px); opacity: 0; }
}

/* Winding — crown arrow rotates */
.step-sketch--wind .sk-wind-arrow {
  transform-origin: 167px 100px;
  animation: sk-wind-spin 4s linear infinite;
}
@keyframes sk-wind-spin {
  to { transform: rotate(360deg); }
}

/* Reduce motion */
@media (prefers-reduced-motion: reduce) {
  .step-sketch *,
  .step-sketch::after {
    animation: none !important;
  }
}

/* Quote, rules, places, warn — these are block elements that should NOT
   wrap around a floated sketch (they'd look jagged). Force them to clear. */
.step-body .step-quote,
.step-body .step-rules,
.step-body .places-grid,
.step-body .step-warn {
  clear: right;
}

/* Layout: a small floated sidebar — the text wraps around it naturally.
   On narrow screens the float falls back to a stacked block. */
@media (max-width: 640px) {
  .step-sketch {
    float: none;
    width: auto;
    max-width: none;
    margin: 16px 0 0;
  }
}
</style>
